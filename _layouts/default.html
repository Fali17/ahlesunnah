<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  
  <!-- Font assets -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Main theme stylesheet -->
  <link rel="stylesheet" href="{{ 'assets/css/main.css' | relative_url }}">
</head>
<body>

  <!-- Top Header Layout bar -->
  <header class="site-header">
    <div class="header-container">
      
      <!-- Top Left Hamburger Activation button -->
      <button class="menu-toggle-btn" id="openMenuBtn" aria-label="Open navigation menu">☰</button>
      
      <!-- Brand Details Center Stack Wrap -->
      <div class="header-inner">
        <div class="logo-wrap">
          <img src="{{ 'assets/logo.png' | relative_url }}" alt="Ahle Sunnah Al Islam Logo" class="site-logo">
        </div>
        <div>
          <h1>{{ site.title }}</h1>
          <p class="subtitle">{{ site.description }}</p>
        </div>
      </div>

      <!-- Top Right Functional Live Search Interface Components -->
      <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="Search articles..." autocomplete="off">
        <span class="search-icon">🔍</span>
        <div id="searchResults" class="search-results-dropdown"></div>
      </div>

    </div>
  </header>

  <!-- Navigation Drawer Component Modules -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar-nav" id="sidebarMenu">
    <div class="sidebar-header">
      <h2>Menu Nav</h2>
      <button class="sidebar-close-btn" id="closeMenuBtn" aria-label="Close navigation menu">&times;</button>
    </div>
    <div class="sidebar-links">
      <a href="{{ 'index.html' | relative_url }}">Home</a>
      <a href="{{ 'about.html' | relative_url }}">About</a>
      <a href="{{ 'contact.html' | relative_url }}">Contact</a>
      <a href="{{ 'documents.html' | relative_url }}">Documents</a>
      <a href="{{ 'priv.html' | relative_url }}">Privacy Policy</a>
      <a href="{{ 'terms.html' | relative_url }}">Terms And Conditions</a>
    </div>
  </nav>

  <!-- Main content wrapper -->
  <main class="site-main">
    {{ content }}
  </main>

  <!-- Footer layout block -->
  <footer class="site-footer">
    <div class="site-footer-inner">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scroll-to-top component -->
  <button id="backToTop" title="Go to top">↑</button>

  <!-- Simple Jekyll Search Engine Library Code -->
  <script src="https://unpkg.com"></script>

  <!-- Core JavaScript Functionality Links -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // 1. Initialize Jekyll Live Search engine framework
      if (document.getElementById('searchInput')) {
        SimpleJekyllSearch({
          searchInput: document.getElementById('searchInput'),
          resultsContainer: document.getElementById('searchResults'),
          json: '{{ "/search.json" | relative_url }}',
          searchResultTemplate: '<a href="{url}" class="search-result-item"><div class="search-result-title">{title}</div><div class="search-result-meta">{date}</div><div class="search-result-excerpt">{excerpt}</div></a>',
          noResultsText: '<div class="search-no-results">No results found</div>'
        });

        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        
        // Open search view on data interaction values
        searchInput.addEventListener('input', function() {
          searchResults.style.display = this.value.length > 0 ? 'block' : 'none';
        });
        
        // Close search selection menu when users tap away
        document.addEventListener('click', function(e) {
          if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
            searchResults.style.display = 'none';
          }
        });
      }

      // 2. Sliding Burger Navigation interface functions
      const openMenuBtn = document.getElementById('openMenuBtn');
      const closeMenuBtn = document.getElementById('closeMenuBtn');
      const sidebarMenu = document.getElementById('sidebarMenu');
      const sidebarOverlay = document.getElementById('sidebarOverlay');

      function toggleMenu(isOpen) {
        if (isOpen) {
          sidebarMenu.classList.add('is-open');
          sidebarOverlay.classList.add('is-visible');
          document.body.style.overflow = 'hidden';
        } else {
          sidebarMenu.classList.remove('is-open');
          sidebarOverlay.classList.remove('is-visible');
          document.body.style.overflow = '';
        }
      }

      if(openMenuBtn && closeMenuBtn && sidebarMenu && sidebarOverlay) {
        openMenuBtn.addEventListener('click', () => toggleMenu(true));
        closeMenuBtn.addEventListener('click', () => toggleMenu(false));
        sidebarOverlay.addEventListener('click', () => toggleMenu(false));
      }

      // 3. Back to Top Action trigger conditions
      const backToTopBtn = document.getElementById('backToTop');
      if (backToTopBtn) {
        window.addEventListener('scroll', function() {
          if (window.scrollY > 300) {
            backToTopBtn.style.display = 'block';
          } else {
            backToTopBtn.style.display = 'none';
          }
        });
        backToTopBtn.addEventListener('click', function() {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }
    });
  </script>
</body>
</html>
