<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  <link rel="alternate" type="application/atom+xml" href="{{ "/feed.xml" | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-wrap">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjdHWh2ODuFtzgC1xyw35UnS2SgR89KOA9tKYlntwhKttJ04aqqgc9q_OW9q9gma_vaa8gLdbZc2vWf4ubKUxygsJLRA2WtIrq_BDjS3scGuJNYgp2njyVdF7lgXod305L47cIExCOuSNsLHy59WLd4jcy9fOueCVhWpJObMYrZTu4pZ-OCwUda33W5GCM/s1600/4395.png" alt="Ahle Sunnah Al Islam Logo" class="site-logo">
      </div>
      <h1 class="site-title">Ahle Sunnah Al Islam</h1>
      <p class="site-tagline">Sharing the truth and exposing lies</p>
    </div>
    <nav class="site-nav">
      <a href="{{ "/" | relative_url }}">Home</a>
      <a href="{{ "/about/" | relative_url }}">About</a>
      <a href="{{ "/#labels" | relative_url }}">Labels</a>
      <a href="{{ "/feed.xml" | relative_url }}">RSS</a>
    </nav>
  </header>

  <main class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{ "now" | date: "%Y" }} {{ site.title }} — All rights reserved for the sake of Allah.</p>
      <p class="footer-small">Built with Jekyll • Deployed on GitHub Pages</p>
    </div>
  </footer>
</body>
</html>
