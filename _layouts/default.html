<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ 'assets/css/main.css' | relative_url }}">
  <style>
  /* --- Modern Main Header Navigation Styles --- */
  header, .site-header {
    background: #145a32;
    border-bottom: 1px solid #145a32;
    padding: 15px 0;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  
  header .container, .site-header .wrapper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Logo branding link */
  .site-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: #111111 !important;
    text-decoration: none;
    letter-spacing: -0.5px;
  }

  /* Navigation elements */
  .site-nav {
    display: flex;
    align-items: center;
  }

  .site-nav .trigger {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .site-nav a.page-link {
    color: #555555 !important;
    text-decoration: none !important;
    font-weight: 500;
    font-size: 0.95rem;
    padding: 6px 4px;
    position: relative;
    transition: color 0.2s ease;
  }

  /* Animated underline effect on desktop hover */
  .site-nav a.page-link::after {
    content: '';
    position: absolute;
    width: 100%;
    transform: scaleX(0);
    height: 2px;
    bottom: 0;
    left: 0;
    background-color: #2a7ae2;
    transform-origin: bottom right;
    transition: transform 0.25s ease-out;
  }

  .site-nav a.page-link:hover {
    color: #2a7ae2 !important;
  }

  .site-nav a.page-link:hover::after {
    transform: scaleX(1);
    transform-origin: bottom left;
  }

  /* --- Mobile Optimization (Smartphones & Tablets) --- */
  @media (max-width: 768px) {
    header .container, .site-header .wrapper {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      padding: 0 15px;
    }

    .site-nav {
      width: 100%;
    }

    /* Creates a sleek swipe horizontal menu block on phone views */
    .site-nav .trigger {
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 5px;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }
    
    /* Hide scrollbars for a clean look while maintaining swipe action */
    .site-nav .trigger::-webkit-scrollbar {
      display: none;
    }
    
    .site-nav a.page-link {
      font-size: 0.9rem;
      padding: 4px 0;
    }
  }
</style>

</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-wrap">
        <img src="{{ 'assets/logo.png' | relative_url }}" alt="Ahle Sunnah Al Islam Logo" class="site-logo">
      </div>
      <h1>{{ site.title }}</h1>
      <p class="subtitle">{{ site.description }}</p>
    </div>
    <nav class="site-nav">
      <a href="{{ 'index.html'| relative_url }}">Home</a>
      <a href="{{ 'about.html'| relative_url }}">About</a>
       <a href="{{ 'contact.html'| relative_url }}">Contact</a>
       <a href="{{ 'documents.html'| relative_url }}">Documents</a>
       <a href="{{ 'priv.html'| relative_url }}">Privacy Policy</a>
       <a href="{{ 'terms.html'| relative_url }}">Terms And Conditions</a>
    </nav>
  </header>
  <main class="site-main">
    {{ content }}
  </main>
  <footer class="site-footer">
<p>&copy; {{ 'now' | date: '%Y' }} Ahle Sunnah. All rights reserved.</p>
  </footer>
  <button id="backToTop" title="Go to top">&#8593;</button>
  <script>
  const backToTopButton = document.getElementById("backToTop");

  // Show the button when user scrolls down 300px from the top
  window.onscroll = function() {
    if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
      backToTopButton.style.display = "block";
    } else {
      backToTopButton.style.display = "none";
    }
  };

  // When clicked, smoothly scroll back to the top
  backToTopButton.addEventListener("click", function() {
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  });
</script>

</body>
</html>
