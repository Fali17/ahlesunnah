<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-wrap">
        <img src="{{ '/assets/logo.png' | relative_url }}" alt="Ahle Sunnah Al Islam Logo" class="site-logo">
      </div>
      <h1>{{ site.title }}</h1>
      <p class="subtitle">{{ site.description }}</p>
    </div>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/tags/' | relative_url }}">Topics</a>
      <a href="https://alsunnahalislam.blogspot.com" target="_blank">Old Blog</a>
    </nav>
  </header>
  <main class="site-main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>© {{ 'now' | date: "%Y" }} Ahle Sunnah Al Islam - Ahlus Sunnah wal Jamaah</p>
    <p class="small">Originally from Blogger - Now on GitHub Pages</p>
  </footer>
</body>
</html>
