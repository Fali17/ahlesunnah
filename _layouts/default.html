<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  
  <!-- Google Fonts Grid Link -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3 CSS Link -->
  <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Theme main.css -->
  <link rel="stylesheet" href="{{ 'assets/css/main.css' | relative_url }}">

  <style>
    /* Retain your custom deep green bar theme */
    .bg-brand-green {
      background-color: #145a32 !important;
    }
    
    /* Style layout parameters for navbar typography alignment */
    .navbar-brand h1 {
      font-size: 1.5rem;
      margin: 0;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
    }
    
    .navbar-brand .subtitle {
      font-size: 0.8rem;
      margin: 0;
      color: #d4efdf;
      font-weight: 400;
    }

    .navbar-light .navbar-nav .nav-link {
      color: rgba(255, 255, 255, 0.85) !important;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .navbar-light .navbar-nav .nav-link:hover,
    .navbar-light .navbar-nav .nav-link.active {
      color: #ffffff !important;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    /* Customized white hamburger icon toggler outlines */
    .custom-toggler.navbar-toggler {
      border-color: rgba(255, 255, 255, 0.25);
    }
    .custom-toggler .navbar-toggler-icon {
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://w3.org stroke='rgba%28255, 255, 255, 0.85%29' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
    }

    /* Ensure structural site elements respect top sticky heights */
    .site-main {
      min-height: 80vh;
    }
  </style>
</head>
<body>

  <!-- Bootstrap 5 Sticky Navigation Bar -->
  <nav class="navbar navbar-expand-xl navbar-light bg-brand-green sticky-top shadow-sm py-3">
    <div class="container">
      
      <!-- Brand Heading/Logo Container Section -->
      <a class="navbar-brand d-flex align-items-center gap-3 text-decoration-none" href="{{ '/' | relative_url }}">
        <div class="logo-wrap" style="max-width: 45px;">
          <img src="{{ 'assets/logo.png' | relative_url }}" alt="Ahle Sunnah Al Islam Logo" class="img-fluid site-logo" style="height: auto; width: 100%;">
        </div>
        <div class="d-flex flex-column justify-content-center">
          <h1>{{ site.title }}</h1>
          <p class="subtitle">{{ site.description }}</p>
        </div>
      </a>

      <!-- Mobile Dropdown Toggler Activation Control Trigger -->
      <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#ahleSunnahNavMenu" aria-controls="ahleSunnahNavMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- The Collapsible Responsive Link Layout Navigation -->
      <div class="collapse navbar-collapse" id="ahleSunnahNavMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-2 text-end text-xl-start pt-3 pt-xl-0">
          <li class="nav-item">
            <a class="nav-link {% if page.url == '/' or page.url == '/index.html' %}active fw-bold{% endif %}" href="{{ 'index.html' | relative_url }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if page.url contains 'about' %}active fw-bold{% endif %}" href="{{ 'about.html' | relative_url }}">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if page.url contains 'contact' %}active fw-bold{% endif %}" href="{{ 'contact.html' | relative_url }}">Contact</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if page.url contains 'documents' %}active fw-bold{% endif %}" href="{{ 'documents.html' | relative_url }}">Documents</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if page.url contains 'priv' %}active fw-bold{% endif %}" href="{{ 'priv.html' | relative_url }}">Privacy Policy</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if page.url contains 'terms' %}active fw-bold{% endif %}" href="{{ 'terms.html' | relative_url }}">Terms And Conditions</a>
          </li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- Injecting Main Content Blocks via Native Grid Containers -->
  <main class="site-main container my-5">
    {{ content }}
  </main>

  <!-- Footers -->
  <footer class="site-footer bg-light border-top py-4 text-center text-muted">
    <div class="container">
      <p class="m-0">&copy; {{ 'now' | date: '%Y' }} Ahle Sunnah. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scroll-Back to Top Interaction Component -->
  <button id="backToTop" title="Go to top">↑</button>

  <!-- Bootstrap 5 JavaScript Bundle Core Injection -->
  <script src="https://jsdelivr.net" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <script>
    const backToTopButton = document.getElementById("backToTop");

    window.onscroll = function() {
      if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
        backToTopButton.style.display = "block";
      } else {
        backToTopButton.style.display = "none";
      }
    };

    backToTopButton.addEventListener("click", function() {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>

</body>
</html>
