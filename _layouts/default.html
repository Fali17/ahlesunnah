<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="{{ 'assets/css/main.css' | relative_url }}">
  
</head>
<body>

   <!-- 1. FIXED: Added correct CDN package path and matching element IDs for search -->
  <script src="https://unpkg.com"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Initialize Jekyll Search
      if (document.getElementById('searchInput')) {
        SimpleJekyllSearch({
          searchInput: document.getElementById('searchInput'),
          resultsContainer: document.getElementById('searchResults'),
          json: '{{ "/search.json" | relative_url }}',
          searchResultTemplate: '<a href="{url}" class="search-result-item"><div class="search-result-title">{title}</div><div class="search-result-meta">{date}</div><div class="search-result-excerpt">{excerpt}</div></a>',

          noResultsText: '<div class="search-no-results">No results found</div>'
        });

        // Show/Hide search dropdown dynamically on input focus
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        
        searchInput.addEventListener('input', function() {
          searchResults.style.display = this.value.length > 0 ? 'block' : 'none';
        });
        
        document.addEventListener('click', function(e) {
          if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
            searchResults.style.display = 'none';
          }
        });
      }

      // 2. FIXED: Added logic to handle sliding burger menu drawer interactions
      const openMenuBtn = document.getElementById('openMenuBtn');
      const closeMenuBtn = document.getElementById('closeMenuBtn');
      const sidebarMenu = document.getElementById('sidebarMenu');
      const sidebarOverlay = document.getElementById('sidebarOverlay');

      function toggleMenu(isOpen) {
        if (isOpen) {
          sidebarMenu.classList.add('is-open');
          sidebarOverlay.classList.add('is-visible');
          document.body.style.overflow = 'hidden'; // Prevents background body scrolling
        } else {
          sidebarMenu.classList.remove('is-open');
          sidebarOverlay.classList.remove('is-visible');
          document.body.style.overflow = '';
        }
      }

      openMenuBtn.addEventListener('click', () => toggleMenu(true));
      closeMenuBtn.addEventListener('click', () => toggleMenu(false));
      sidebarOverlay.addEventListener('click', () => toggleMenu(false));
    });
  </script>

  <!-- Top Header Layout bar -->
  <header class="site-header">
    <div class="header-container">
      
      <!-- Top Left Hamburger Activation button -->
      <button class="menu-toggle-btn" id="openMenuBtn" aria-label="Open navigation menu">☰</button>
      
      <!-- Brand Details Center Stack Wrap -->
      <div class="header-inner">
        <div class="logo-wrap">
          <img src="{{ 'assets/logo.png' | relative_url }}" alt="Ahle Sunnah Al Islam Logo" class="site-logo">
        </div>
        <div>
          <h1>{{ site.title }}</h1>
          <p class="subtitle">{{ site.description }}</p>
        </div>
      </div>

      <!-- Top Right Functional Live Search Interface Components -->
      <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="Search articles..." autocomplete="off">
        <span class="search-icon">🔍</span>
        <div id="searchResults" class="search-results-dropdown"></div>
      </div>

    </div>
  </header>

  <!-- Navigation Drawer Component Modules -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar-nav" id="sidebarMenu">
    <div class="sidebar-header">
      <h2>Menu Nav</h2>
      <button class="sidebar-close-btn" id="closeMenuBtn" aria-label="Close navigation menu">&times;</button>
    </div>
    <div class="sidebar-links">
      <a href="{{ 'index.html' | relative_url }}">Home</a>
      <a href="{{ 'about.html' | relative_url }}">About</a>
      <a href="{{ 'contact.html' | relative_url }}">Contact</a>
      <a href="{{ 'documents.html' | relative_url }}">Documents</a>
      <a href="{{ 'priv.html' | relative_url }}">Privacy Policy</a>
      <a href="{{ 'terms.html' | relative_url }}">Terms And Conditions</a>
    </div>
  </nav>


  <!-- Core Content Block Injector Layout -->
  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ 'now' | date: '%Y' }} Ahle Sunnah. All rights reserved.</p>
  </footer>

  <button id="backToTop" title="Go to top">↑</button>

  <script>
    // --- 1. Pure JS Live JSON Search Core Engine Engine ---
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    let searchDatabase = [];

    // Pre-fetch search database index quietly when reader interacts near navbar input fields
    fetch("{{ '/search.json' | relative_url }}")
      .then(response => response.json())
      .then(data => { searchDatabase = data; })
      .catch(err => console.error("Could not fetch search index file data maps:", err));

    searchInput.addEventListener('input', function() {
      const query = this.value.toLowerCase().trim();
      searchResults.innerHTML = '';

      if (query.length < 2) {
        searchResults.style.display = 'none';
        return;
      }

      // Filter matches within search text tokens
      const filtered = searchDatabase.filter(item => {
        return item.title.toLowerCase().includes(query) || 
               item.excerpt.toLowerCase().includes(query);
      });

      if (filtered.length > 0) {
        filtered.forEach(item => {
          const resElement = document.createElement('a');
          resElement.href = item.url;
          resElement.className = 'search-result-item';
          resElement.innerHTML = `
            <div class="search-result-title">${item.title}</div>
            <div class="search-result-meta">${item.date}</div>
            <div class="search-result-excerpt">${item.excerpt}</div>
          `;
          searchResults.appendChild(resElement);
        });
      } else {
        searchResults.innerHTML = '<div class="search-no-results">No articles found matching query.</div>';
      }
searchResults.style.display = 'block';});
  
  // Hide dropdown box context boundaries whenever clicking completely off input 
    panelsdocument.addEventListener('click', function(e) {if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {searchResults.style.display = 'none';}});
    // --- 2. Sidebar Navigation Management Scripts ---
const sidebarMenu = document.getElementById("sidebarMenu");const sidebarOverlay = document.getElementById("sidebarOverlay");const openMenuBtn = document.getElementById("openMenuBtn");const closeMenuBtn = document.getElementById("closeMenuBtn");function openSidebar() {sidebarMenu.classList.add("is-open");sidebarOverlay.classList.add("is-visible");openMenuBtn.style.opacity = "0";}function closeSidebar() {sidebarMenu.classList.remove("is-open");sidebarOverlay.classList.remove("is-visible");openMenuBtn.style.opacity = "1";}openMenuBtn.addEventListener("click", openSidebar);closeMenuBtn.addEventListener("click", closeSidebar);sidebarOverlay.addEventListener("click", closeSidebar);// --- 3. Scroll to Top Trigger System ---
  const backToTopButton = document.getElementById("backToTop");window.onscroll = function() {if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {backToTopButton.style.display = "block";} else {backToTopButton.style.display = "none";}};backToTopButton.addEventListener("click", function() {window.scrollTo({ top: 0, behavior: "smooth" });});

  </script>

  <script>
const menuToggle = document.getElementById('menu-toggle');
const menuClose = document.getElementById('menu-close');
const navMenu = document.getElementById('nav-menu');

menuToggle.addEventListener('click', () => {
    navMenu.classList.add('active'); // Or change style.display = 'block'
});

menuClose.addEventListener('click', () => {
    navMenu.classList.remove('active'); // Or change style.display = 'none'
});
    
  </script>
  
</body>
</html>
