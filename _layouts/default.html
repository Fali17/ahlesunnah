<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ 'assets/css/main.css' | relative_url }}">
  
  <style>
  /* --- Core Base & Header Layout --- */
  header, .site-header {
    background: #145a32;
    border-bottom: 1px solid #145a32;
    padding: 15px 0;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  
  .header-container {
    display: flex;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    position: relative;
  }

  /* Inner Branding Alignment */
  .header-inner {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-left: auto; /* Balances against left burger trigger space */
    margin-right: auto;
  }

  .logo-wrap .site-logo {
    height: 45px;
    width: auto;
    display: block;
  }

  .header-inner h1 {
    font-size: 1.4rem;
    font-weight: 700;
    color: #ffffff;
    margin: 0;
    font-family: 'Inter', sans-serif;
  }

  .header-inner .subtitle {
    font-size: 0.85rem;
    color: #d4efdf;
    margin: 0;
    font-family: 'Inter', sans-serif;
  }

  /* --- Top-Left Hamburger Trigger Button --- */
  .menu-toggle-btn {
    background: none;
    border: none;
    color: #ffffff;
    font-size: 1.8rem;
    cursor: pointer;
    padding: 5px 10px;
    line-height: 1;
    z-index: 1010;
    font-family: sans-serif;
    position: absolute;
    left: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease;
  }

  .menu-toggle-btn:focus {
    outline: none;
  }

  /* --- Pure CSS Sliding Left Sidebar Menu --- */
  .sidebar-nav {
    position: fixed;
    top: 0;
    left: -280px; /* Starts completely hidden on left margin fields */
    width: 280px;
    height: 100%;
    background-color: #145a32;
    box-shadow: 4px 0 15px rgba(0, 0, 0, 0.15);
    z-index: 2000;
    transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    padding: 0;
    font-family: 'Inter', sans-serif;
  }

  /* JavaScript Hook activation rule */
  .sidebar-nav.is-open {
    left: 0;
  }

  /* Sidebar Inner Header Content */
  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px;
    background-color: #145a32;
    color: #ffffff;
  }

  .sidebar-header h2 {
    font-size: 1.15rem;
    margin: 0;
    font-weight: 600;
  }

  .sidebar-close-btn {
    background: none;
    border: none;
    color: #ffffff;
    font-size: 1.5rem;
    cursor: pointer;
    font-weight: bold;
    padding: 0 5px;
    line-height: 1;
  }

  /* Sidebar Links UI Styles */
  .sidebar-links {
    display: flex;
    flex-direction: column;
    padding: 15px 10px;
    gap: 4px;
  }

  .sidebar-links a {
    color: #ffffff !important;
    text-decoration: none !important;
    font-weight: 500;
    font-size: 1rem;
    padding: 12px 15px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .sidebar-links a:hover {
    background-color:#326347;
    color: #ffffff !important;
    padding-left: 20px;
  }

  /* Dark Overlay dim background layer when menu stays active */
  .sidebar-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    z-index: 1990;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
  }

  .sidebar-overlay.is-visible {
    opacity: 1;
    visibility: visible;
  }

  /* --- Main Content Base Layout --- */
  .site-main {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
    min-height: 75vh;
  }

  .site-footer {
    text-align: center;
    padding: 25px 0;
    background: #fafafa;
    border-top: 1px solid #eeeeee;
    color: #666666;
  }
</style>
 
  </button>

  <!-- Left-Sliding Green Theme Search Drawer Panel -->
  <div id="searchOverlayPanel" class="search-overlay-panel">
    <div class="search-panel-header">
      <div class="search-input-group">
        <input type="text" id="customSearchInput" placeholder="Type to search & highlight..." autocomplete="off">
        <button id="clearSearchBtn" class="clear-search-btn">Clear</button>
      </div>
      <!-- Close (X) Drawer Toggle Button -->
      <button id="closeSearchBtn" class="close-search-btn" aria-label="Close search">&times;</button>
    </div>
    <!-- Live Results Dropdown Output Link Deck -->
    <div id="dropdownSearchResults" class="dropdown-results-container"></div>
  </div>
</div>

<style>
  /* --- Right Side Green Search Button Custom Styling --- */
  .search-wrapper {
    position: relative;
    z-index: 1010;
  }
  .search-icon-btn { 
    background: #114627; /* Rich darker contrasting green badge background */
    border: 1px solid rgba(255,255,255,0.15); 
    border-radius: 50%;
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    padding: 10px; 
    transition: background 0.2s ease;
  }
  .search-icon-btn:hover {
    background: #0b301a;
  }
  
  /* --- Smooth Leftward-Expanding Drawer Panel Configuration --- */
  .search-overlay-panel {
    position: fixed; 
    top: 0; 
    right: -100%; /* Default hidden position past the right border */
    width: 100%; 
    max-width: 400px; 
    height: 100%;
    background: #ffffff; 
    box-shadow: -6px 0 25px rgba(0,0,0,0.18); 
    z-index: 2500;
    display: flex; 
    flex-direction: column; 
    transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); /* Pulls leftwards elegantly when active */
  }
  .search-overlay-panel.is-active { 
    right: 0; 
  }
  
  /* Panel Interior Green Title Header bar */
  .search-panel-header { 
    display: flex; 
    align-items: center; 
    padding: 16px 20px; 
    background: #145a32; /* Primary Brand Green background block */
    gap: 12px; 
  }
  .search-input-group { 
    position: relative; 
    flex-grow: 1; 
    display: flex; 
    align-items: center; 
  }
  #customSearchInput { 
    width: 100%; 
    padding: 8px 65px 8px 12px; 
    border-radius: 6px; 
    border: 1px solid rgba(0,0,0,0.1); 
    font-size: 0.95rem; 
    outline: none; 
    font-family: 'Inter', sans-serif;
  }
  .clear-search-btn { 
    position: absolute; 
    right: 6px; 
    background: #dfdfdf; 
    border: none; 
    padding: 4px 8px; 
    border-radius: 4px; 
    font-size: 0.75rem; 
    font-weight: 600;
    cursor: pointer; 
    display: none; /* Controlled dynamically via query entry length */
    color: #222;
  }
  .clear-search-btn:hover { background: #ccc; }
  .close-search-btn { background: none; border: none; color: #ffffff; font-size: 1.8rem; cursor: pointer; line-height: 1; }
  .dropdown-results-container { flex-grow: 1; overflow-y: auto; background: #ffffff; }
  
  /* Yellow Highlighter Definition rule */
  mark.search-highlight { 
    background-color: #ffeb3b !important; 
    color: #000000 !important; 
    font-weight: bold; 
    padding: 0 2px; 
    border-radius: 2px;
  }

  /* Responsive screen adaptations */
  @media (max-width: 576px) {
    .search-overlay-panel { 
      max-width: 85%; /* Keeps a small slice of the website visible behind it on phone screens */
    }
  }
</style>

</head>
<body>

  <header class="site-header">
  <div class="header-container">
    
    <!-- Left Side Hamburger Menu Trigger -->
    <button class="menu-toggle-btn" id="openMenuBtn" aria-label="Open navigation menu">☰</button>
    
    
    <div class="header-inner">
      <div class="logo-wrap">
        <img src="{{ 'assets/logo.png' | relative_url }}" alt="Logo" class="site-logo">
      </div>
      <div>
        <h1>{{ site.title }}</h1>
      </div>
    </div>

    <!-- Corrected Top-Right Green Background Search Trigger & Slider Panel Wrapper -->
    <div class="search-wrapper">
      <button id="searchTriggerBtn" class="search-icon-btn" aria-label="Open search">
        <svg xmlns="http://w3.org" height="24px" viewBox="0 -960 960 960" width="24px" fill="#ffffff"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
      </button>

      <div id="searchOverlayPanel" class="search-overlay-panel">
        <div class="search-panel-header">
          <div class="search-input-group">
            <input type="text" id="customSearchInput" placeholder="Type to search..." autocomplete="off">
            <button id="clearSearchBtn" class="clear-search-btn">Clear</button>
          </div>
          <button id="closeSearchBtn" class="close-search-btn" aria-label="Close search">&times;</button>
        </div>
        <div id="dropdownSearchResults" class="dropdown-results-container"></div>
      </div>
    </div>

  </div>
</header>


  <!-- Dim Shadow Backdrop Overlay Component -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Left Side Slide-out Drawer Navigation Panel Container -->
  <nav class="sidebar-nav" id="sidebarMenu">
    <div class="sidebar-header">
      <h2>Ahle Sunnah</h2>
      <!-- The X Button inside the Sidebar -->
      <button class="sidebar-close-btn" id="closeMenuBtn" aria-label="Close navigation menu">&times;</button>
    </div>
    <div class="sidebar-links">
      <a href="{{ 'index.html' | relative_url }}">Home</a>
      <a href="{{ 'about.html' | relative_url }}">About</a>
      <a href="{{ 'contact.html' | relative_url }}">Contact</a>
      <a href="{{ 'documents.html' | relative_url }}">Documents</a>
      <a href="{{ 'priv.html' | relative_url }}">Privacy Policy</a>
      <a href="{{ 'terms.html' | relative_url }}">Terms And Conditions</a>
    </div>
  </nav>

  <!-- Core Content Block Wrap -->
  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ 'now' | date: '%Y' }} Ahle Sunnah. All rights reserved.</p>
  </footer>

  <button id="backToTop" title="Go to top">↑</button>

  <!-- Integrated Menu Toggles & Back-To-Top Interaction Scripting Logic -->
  <script>
    // 1. Sidebar Panel Toggling Logic Mechanics
    const sidebarMenu = document.getElementById("sidebarMenu");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const openMenuBtn = document.getElementById("openMenuBtn");
    const closeMenuBtn = document.getElementById("closeMenuBtn");

    function openSidebar() {
      sidebarMenu.classList.add("is-open");
      sidebarOverlay.classList.add("is-visible");
      openMenuBtn.style.opacity = "0"; // Smoothly hide the ☰ icon behind the opening slider sheet
    }

    function closeSidebar() {
      sidebarMenu.classList.remove("is-open");
      sidebarOverlay.classList.remove("is-visible");
      openMenuBtn.style.opacity = "1"; // Return visibility to ☰ when drawer is dismissed
    }

    // Attach Event Triggers
    openMenuBtn.addEventListener("click", openSidebar);
    closeMenuBtn.addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    // 2. Back to Top Scroll Logic
    const backToTopButton = document.getElementById("backToTop");

    window.onscroll = function() {
      if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
        backToTopButton.style.display = "block";
      } else {
        backToTopButton.style.display = "none";
      }
    };

    backToTopButton.addEventListener("click", function() {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>

   <script>
    // --- 1. DOM Element Bindings ---
    const searchTriggerBtn = document.getElementById('searchTriggerBtn');
    const searchOverlayPanel = document.getElementById('searchOverlayPanel');
    const closeSearchBtn = document.getElementById('closeSearchBtn');
    const customSearchInput = document.getElementById('customSearchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const dropdownSearchResults = document.getElementById('dropdownSearchResults');
    const sidebarMenu = document.getElementById("sidebarMenu");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const openMenuBtn = document.getElementById("openMenuBtn");
    const closeMenuBtn = document.getElementById("closeMenuBtn");
    const backToTopButton = document.getElementById("backToTop");

    let searchDb = [];
    const isPostPage = window.location.pathname.includes('/202') || !!document.querySelector('.post-content, article');

    // Fetch the Jekyll search catalog safely
    fetch("{{ '/search.json' | relative_url }}")
      .then(res => res.json())
      .then(data => { searchDb = data; })
      .catch(err => console.error("Database failed to load: ", err));

    // --- 2. Search Drawer Core Logic ---
    if (searchTriggerBtn) {
      searchTriggerBtn.addEventListener('click', () => {
        if (searchOverlayPanel) searchOverlayPanel.classList.add('is-active');
        setTimeout(() => { if (customSearchInput) customSearchInput.focus(); }, 150);
      });
    }

    function closeSearchPanel() {
      if (searchOverlayPanel) searchOverlayPanel.classList.remove('is-active');
      if (customSearchInput) customSearchInput.value = '';
      if (clearSearchBtn) clearSearchBtn.style.display = 'none';
      if (dropdownSearchResults) dropdownSearchResults.innerHTML = '';
      removeHighlights();
    }

    if (closeSearchBtn) closeSearchBtn.addEventListener('click', closeSearchPanel);

    if (clearSearchBtn) {
      clearSearchBtn.addEventListener('click', () => {
        if (customSearchInput) {
          customSearchInput.value = '';
          customSearchInput.focus();
        }
        clearSearchBtn.style.display = 'none';
        if (dropdownSearchResults) dropdownSearchResults.innerHTML = '';
        removeHighlights();
      });
    }

    // --- 3. Live Input Filter Scanner ---
    if (customSearchInput) {
      customSearchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        if (clearSearchBtn) clearSearchBtn.style.display = query.length > 0 ? 'block' : 'none';
        if (dropdownSearchResults) dropdownSearchResults.innerHTML = '';

        if (query.length < 2) {
          removeHighlights();
          return;
        }

        highlightTextOnPage(query);

        const matches = searchDb.filter(item => item.title.toLowerCase().includes(query) || item.excerpt.toLowerCase().includes(query));
        if (matches.length > 0 && !isPostPage && dropdownSearchResults) {
          matches.forEach(item => {
            const link = document.createElement('a');
            link.href = item.url; 
            link.className = 'drop-res-item';
            link.style.display = 'block';
            link.style.padding = '12px 15px';
            link.style.borderBottom = '1px solid #f0f0f0';
            link.style.textDecoration = 'none';
            link.innerHTML = `<div style="font-weight:600;color:#145a32;font-size:0.95rem;">${item.title}</div>`;
            dropdownSearchResults.appendChild(link);
          });
        }
      });
    }

    // --- 4. Deep Live Highlight Injection Engine ---
    function highlightTextOnPage(keyword) {
      removeHighlights();
      const targetArea = document.querySelector('.post-content') || document.querySelector('article') || document.querySelector('.site-main');
      if (!targetArea) return;

      const walk = document.createTreeWalker(targetArea, NodeFilter.SHOW_TEXT, null, false);
      const textNodes = [];
      while (walk.nextNode()) textNodes.push(walk.currentNode);

      textNodes.forEach(node => {
        const parent = node.parentNode;
        if (!parent || parent.tagName === 'SCRIPT' || parent.tagName === 'STYLE' || parent.classList.contains('search-highlight')) return;

        const text = node.nodeValue;
        const lowerText = text.toLowerCase();
        
        if (lowerText.includes(keyword)) {
          const span = document.createElement('span');
          span.className = 'search-highlight-container';
          
          let html = '';
          let lastIndex = 0;
          let index = lowerText.indexOf(keyword);
          
          while (index !== -1) {
            html += escapeHtml(text.substring(lastIndex, index));
            html += `<mark class="search-highlight">${escapeHtml(text.substring(index, index + keyword.length))}</mark>`;
            lastIndex = index + keyword.length;
            index = lowerText.indexOf(keyword, lastIndex);
          }
          html += escapeHtml(text.substring(lastIndex));
          
          span.innerHTML = html;
          parent.replaceChild(span, node);
        }
      });
    }

    function removeHighlights() {
      document.querySelectorAll('.search-highlight-container').forEach(span => {
        const parent = span.parentNode;
        if (parent) {
          parent.replaceChild(document.createTextNode(span.textContent), span);
          parent.normalize();
        }
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // --- 5. Sidebar Menu Controls ---
    if (openMenuBtn) {
      openMenuBtn.addEventListener("click", () => {
        if (sidebarMenu) sidebarMenu.classList.add("is-open");
        if (sidebarOverlay) sidebarOverlay.classList.add("is-visible");
        openMenuBtn.style.opacity = "0";
      });
    }

    if (closeMenuBtn) {
      closeMenuBtn.addEventListener("click", () => {
        if (sidebarMenu) sidebarMenu.classList.remove("is-open");
        if (sidebarOverlay) sidebarOverlay.classList.remove("is-visible");
        if (openMenuBtn) openMenuBtn.style.opacity = "1";
      });
    }

    if (sidebarOverlay) {
      sidebarOverlay.addEventListener("click", () => {
        if (sidebarMenu) sidebarMenu.classList.remove("is-open");
        sidebarOverlay.classList.remove("is-visible");
        if (openMenuBtn) openMenuBtn.style.opacity = "1";
      });
    }

    // --- 6. Back To Top Mechanics ---
    window.onscroll = function() {
      if (backToTopButton) {
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
          backToTopButton.style.display = "block";
        } else {
          backToTopButton.style.display = "none";
        }
      }
    };
    if (backToTopButton) {
      backToTopButton.addEventListener("click", function() {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  </script>


</body>
</html>
