<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  
  <!-- Google Fonts Link -->
  <link href="https://googleapis.com" rel="stylesheet">
  
  <!-- Bootstrap 5.3 CSS Link -->
  <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Theme main.css -->
  <link rel="stylesheet" href="{{ 'assets/css/main.css' | relative_url }}">

  <style>
    /* Custom deep green bar theme */
    .bg-brand-green {
      background-color: #145a32 !important;
    }
    
    /* Navbar typography alignment configurations */
    .navbar-brand h1 {
      font-size: 1.5rem;
      margin: 0;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
    }
    
    .navbar-brand .subtitle {
      font-size: 0.8rem;
      margin: 0;
      color: #d4efdf;
      font-weight: 400;
    }

    /* Desktop Navigation Style overrides */
    .navbar-expand-xl .navbar-nav .nav-link {
      color: rgba(255, 255, 255, 0.85) !important;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .navbar-expand-xl .navbar-nav .nav-link:hover,
    .navbar-expand-xl .navbar-nav .nav-link.active {
      color: #ffffff !important;
    }

    /* White hamburger icon toggler outlines */
    .custom-toggler.navbar-toggler {
      border-color: rgba(255, 255, 255, 0.25);
    }
    .custom-toggler .navbar-toggler-icon {
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://w3.org stroke='rgba%28255, 255, 255, 0.85%29' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
    }

    /* Mobile Sidebar Specific Styles */
    @media (max-width: 1199.98px) {
      .offcanvas-navbar-custom {
        width: 280px !important; /* Fixed optimized sidebar width */
      }
      .offcanvas-navbar-custom .nav-link {
        color: #333333 !important;
        font-size: 1.05rem;
        padding: 12px 20px !important;
        border-radius: 6px;
        transition: all 0.2s;
      }
      .offcanvas-navbar-custom .nav-link:hover,
      .offcanvas-navbar-custom .nav-link.active {
        color: #145a32 !important;
        background-color: #eaf2e8; /* Soft green indicator highlight on hover */
        font-weight: 600;
      }
    }

    .site-main {
      min-height: 80vh;
    }
  </style>
</head>
<body>

  <!-- Bootstrap 5 Sticky Navigation Header -->
  <nav class="navbar navbar-expand-xl navbar-light bg-brand-green sticky-top shadow-sm py-3">
    <div class="container">
      
      <!-- Brand Site Logo Heading Layout Section -->
      <a class="navbar-brand d-flex align-items-center gap-3 text-decoration-none" href="{{ '/' | relative_url }}">
        <div class="logo-wrap" style="max-width: 45px;">
          <img src="{{ 'assets/logo.png' | relative_url }}" alt="Ahle Sunnah Al Islam Logo" class="img-fluid site-logo" style="height: auto; width: 100%;">
        </div>
        <div class="d-flex flex-column justify-content-center">
          <h1>{{ site.title }}</h1>
          <p class="subtitle">{{ site.description }}</p>
        </div>
      </a>

      <!-- Sidebar Slide Toggler Control Button -->
      <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#ahleSunnahSidebar" aria-controls="ahleSunnahSidebar" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Sliding Sidebar (Offcanvas Context Element) -->
      <div class="offcanvas offcanvas-start offcanvas-navbar-custom" tabindex="-1" id="ahleSunnahSidebar" aria-labelledby="ahleSunnahSidebarLabel">
        
        <!-- Sidebar Header (Only visible when open on mobile screens) -->
        <div class="offcanvas-header border-bottom d-xl-none">
          <h5 class="offcanvas-title fw-bold" id="ahleSunnahSidebarLabel" style="color: #145a32;">Navigation</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        
        <!-- Sidebar Navigation Link Collection Menu Body -->
        <div class="offcanvas-body p-0 p-xl-0 d-flex flex-column justify-content-between">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-1 gap-xl-2 px-3 py-4 p-xl-0 flex-row flex-wrap d-xl-flex flex-xl-row align-items-xl-center justify-content-start w-100 flex-column">
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/' or page.url == '/index.html' %}active{% endif %}" href="{{ 'index.html' | relative_url }}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url contains 'about' %}active{% endif %}" href="{{ 'about.html' | relative_url }}">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url contains 'contact' %}active{% endif %}" href="{{ 'contact.html' | relative_url }}">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url contains 'documents' %}active{% endif %}" href="{{ 'documents.html' | relative_url }}">Documents</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url contains 'priv' %}active{% endif %}" href="{{ 'priv.html' | relative_url }}">Privacy Policy</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url contains 'terms' %}active{% endif %}" href="{{ 'terms.html' | relative_url }}">Terms And Conditions</a>
            </li>
          </ul>
        </div>
        
      </div>

    </div>
  </nav>

  <!-- Injecting Main Body Post Feeds and Pages Inside Fluid Containers -->
  <main class="site-main container my-5">
    {{ content }}
  </main>

  <!-- Footers -->
  <footer class="site-footer bg-light border-top py-4 text-center text-muted">
    <div class="container">
      <p class="m-0">&copy; {{ 'now' | date: '%Y' }} Ahle Sunnah. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scroll-Back Component -->
  <button id="backToTop" title="Go to top">↑</button>

  <!-- Bootstrap 5 JavaScript Engine Core Scripts -->
  <script src="https://jsdelivr.net" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <script>
    const backToTopButton = document.getElementById("backToTop");

    window.onscroll = function() {
      if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
        backToTopButton.style.display = "block";
      } else {
        backToTopButton.style.display = "none";
      }
    };

    backToTopButton.addEventListener("click", function() {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>

</body>
</html>
