<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="stylesheet" href="{{ 'assets/css/main.css' | relative_url }}">
  
  <style>
    /* Extra styles for new elements */
    .report-abuse-btn {
      display: inline-block;
      margin: 20px auto 10px;
      padding: 8px 18px;
      background: #f8fafc;
      color: #64748b;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .report-abuse-btn:hover {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #fca5a5;
    }
    .report-abuse-wrap {
      text-align: center;
      margin-top: 10px;
    }

    /* Better search icon */
    .search-wrapper {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      pointer-events: none;
      color: #d4efdf;
      transition: color 0.3s ease;
    }
    .search-input:focus + .search-icon {
      color: var(--primary, #0e4a2d);
    }
    .search-input {
      padding-left: 38px !important;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="site-header">
    <div class="header-container">
      
      <!-- Hamburger -->
      <button class="menu-toggle-btn" id="openMenuBtn" aria-label="Open navigation menu">☰</button>
      
      <!-- Brand -->
      <div class="header-inner">
        <div class="logo-wrap">
          <img src="{{ 'assets/logo.png' | relative_url }}" alt="Ahle Sunnah Al Islam Logo" class="site-logo">
        </div>
        <div>
          <h1>{{ site.title }}</h1>
          <p class="subtitle">{{ site.description }}</p>
        </div>
      </div>

      <!-- Search -->
      <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="Search articles..." autocomplete="off">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <div id="searchResults" class="search-results-dropdown"></div>
      </div>

    </div>
  </header>

  <!-- Sidebar Overlay + Menu -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar-nav" id="sidebarMenu">
    <div class="sidebar-header">
      <h2>Menu Nav</h2>
      <button class="sidebar-close-btn" id="closeMenuBtn" aria-label="Close navigation menu">&times;</button>
    </div>
    <div class="sidebar-links">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ 'about.html' | relative_url }}">About</a>
      <a href="{{ 'contact.html' | relative_url }}">Contact</a>
      <a href="{{ 'documents.html' | relative_url }}">Documents</a>
      <a href="{{ 'priv.html' | relative_url }}">Privacy Policy</a>
      <a href="{{ 'terms.html' | relative_url }}">Terms And Conditions</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="site-main">
    {{ content }}
  </main>

  <!-- Report Abuse (above footer) -->
  <div class="report-abuse-wrap">
    <a href="mailto:your-email@example.com?subject=Report%20Abuse%20-%20Ahle%20Sunnah%20Website" class="report-abuse-btn">
      Report Abuse
    </a>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="site-footer-inner">
      <p>&copy; {{ 'now' | date: '%Y' }} Ahle Sunnah. All rights reserved.</p>
    </div>
  </footer>

  <!-- Back to Top Button -->
  <button id="backToTop" title="Go to top">↑</button>

  <script>
    // ========== 1. SEARCH ==========
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    let searchDatabase = [];

    fetch("{{ '/search.json' | relative_url }}")
      .then(response => response.json())
      .then(data => { searchDatabase = data; })
      .catch(err => console.error("Could not load search index:", err));

    searchInput.addEventListener('input', function() {
      const query = this.value.toLowerCase().trim();
      searchResults.innerHTML = '';

      if (query.length < 2) {
        searchResults.style.display = 'none';
        return;
      }

      const filtered = searchDatabase.filter(item => {
        return (item.title && item.title.toLowerCase().includes(query)) || 
               (item.excerpt && item.excerpt.toLowerCase().includes(query));
      });

      if (filtered.length > 0) {
        filtered.slice(0, 8).forEach(item => {  // limit to 8 results
          const resElement = document.createElement('a');
          resElement.href = item.url;
          resElement.className = 'search-result-item';
          resElement.innerHTML = `
            <div class="search-result-title">${item.title || 'Untitled'}</div>
            <div class="search-result-meta">${item.date || ''}</div>
            <div class="search-result-excerpt">${item.excerpt || ''}</div>
          `;
          searchResults.appendChild(resElement);
        });
      } else {
        searchResults.innerHTML = '<div class="search-no-results">No articles found.</div>';
      }
      searchResults.style.display = 'block';
    });

    // Hide search results when clicking outside
    document.addEventListener('click', function(e) {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';
      }
    });

    // ========== 2. SIDEBAR ==========
    const sidebarMenu = document.getElementById("sidebarMenu");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const openMenuBtn = document.getElementById("openMenuBtn");
    const closeMenuBtn = document.getElementById("closeMenuBtn");

    function openSidebar() {
      sidebarMenu.classList.add("is-open");
      sidebarOverlay.classList.add("is-visible");
      openMenuBtn.style.opacity = "0";
      document.body.style.overflow = "hidden"; // prevent background scroll
    }

    function closeSidebar() {
      sidebarMenu.classList.remove("is-open");
      sidebarOverlay.classList.remove("is-visible");
      openMenuBtn.style.opacity = "1";
      document.body.style.overflow = "";
    }

    openMenuBtn.addEventListener("click", openSidebar);
    closeMenuBtn.addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    // Close sidebar when clicking a link
    document.querySelectorAll('.sidebar-links a').forEach(link => {
      link.addEventListener('click', closeSidebar);
    });

    // ========== 3. BACK TO TOP ==========
    const backToTopButton = document.getElementById("backToTop");

    window.addEventListener("scroll", function() {
      if (window.scrollY > 300) {
        backToTopButton.style.display = "block";
      } else {
        backToTopButton.style.display = "none";
      }
    });

    backToTopButton.addEventListener("click", function() {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
  
</body>
</html>
