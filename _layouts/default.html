<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ 'assets/css/main.css' | relative_url }}">
  
  <style>
   /* --- Core Base Header Layout Setup --- */
  header, .site-header {
    background: #145a32;
    border-bottom: 1px solid #145a32;
    padding: 12px 0;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  
  .header-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .menu-toggle-btn {
    background: none;
    border: none;
    color: #ffffff;
    font-size: 1.8rem;
    cursor: pointer;
    padding: 5px;
    display: flex;
    align-items: center;
  }

  .header-inner {
    display: flex;
    align-items: center;
    gap: 15px; /* Creates clean inline space between logo and header text */
    flex-grow: 1;
    margin-left: 20px; /* Forces safety separation gap away from left ☰ icon */
  }
  
  .logo-wrap .site-logo {
    height: 42px;
    width: auto;
    display: block;
  }

  .search-wrapper {
    position: relative;
    z-index: 1010;
    margin-left: auto;
  }

  .search-icon-btn { 
    background: #114627; 
    border: 1px solid rgba(255,255,255,0.15); 
    border-radius: 50%;
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    padding: 10px; 
  }
  
  .search-overlay-panel {
    position: fixed; 
    top: 0; 
    right: -100%; 
    width: 100%; 
    max-width: 400px; 
    height: 100%;
    background: #ffffff; 
    box-shadow: -6px 0 25px rgba(0,0,0,0.18); 
    z-index: 2500;
    display: flex; 
    flex-direction: column; 
    transition: right 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .search-overlay-panel.is-active { right: 0; }
  .search-panel-header { display: flex; align-items: center; padding: 16px 20px; background: #145a32; gap: 12px; }
  .search-input-group { position: relative; flex-grow: 1; display: flex; align-items: center; }
  #customSearchInput { width: 100%; padding: 8px 65px 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.95rem; outline: none; }
  .clear-search-btn { position: absolute; right: 6px; background: #dfdfdf; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; display: none; color: #222; }
  .close-search-btn { background: none; border: none; color: #ffffff; font-size: 1.8rem; cursor: pointer; line-height: 1; }
  .dropdown-results-container { flex-grow: 1; overflow-y: auto; background: #ffffff; }
  
  mark.search-highlight { background-color: #ffeb3b !important; color: #000000 !important; font-weight: bold; padding: 0 2px; border-radius: 2px; }

  /* --- Fixed Mobile Screen Breakpoint Layout Overrides --- */
  @media (max-width: 768px) {
    .header-container {
      padding: 0 12px;
    }
    .header-inner {
      margin-left: 12px; /* Maintains explicit mobile gap away from the ☰ menu icon */
      gap: 8px;
    }
    .header-inner h1 { font-size: 1.05rem; word-break: break-word; }
    .header-inner .subtitle { display: none; }
    .logo-wrap .site-logo { height: 35px; }

    /* Pulls down the panel as a top action banner instead of blocking the document body view */
    .search-overlay-panel {
      top: 0; right: 0; left: 0; width: 100%; max-width: 100%; height: auto;
      transform: translateY(-100%); transition: transform 0.25s ease-in-out;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .search-overlay-panel.is-active { transform: translateY(0); right: auto; }
    .dropdown-results-container { max-height: 160px; }
  }

</style>

</head>
<body>

  <header class="site-header">
  <div class="header-container">
    
    <!-- Left Side Hamburger Menu Trigger -->
    <button class="menu-toggle-btn" id="openMenuBtn" aria-label="Open navigation menu">☰</button>
    
    
    <div class="header-inner">
      <div class="logo-wrap">
        <img src="{{ 'assets/logo.png' | relative_url }}" alt="Logo" class="site-logo">
      </div>
      <div>
        <h1>{{ site.title }}</h1>
      </div>
    </div>

    <!-- Corrected Top-Right Green Background Search Trigger & Slider Panel Wrapper -->
    <div class="search-wrapper">
      <button id="searchTriggerBtn" class="search-icon-btn" aria-label="Open search">
        <svg xmlns="http://w3.org" height="24px" viewBox="0 -960 960 960" width="24px" fill="#ffffff"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
      </button>

      <div id="searchOverlayPanel" class="search-overlay-panel">
        <div class="search-panel-header">
          <div class="search-input-group">
            <input type="text" id="customSearchInput" placeholder="Type to search..." autocomplete="off">
            <button id="clearSearchBtn" class="clear-search-btn">Clear</button>
          </div>
          <button id="closeSearchBtn" class="close-search-btn" aria-label="Close search">&times;</button>
        </div>
        <div id="dropdownSearchResults" class="dropdown-results-container"></div>
      </div>
    </div>

  </div>
</header>


  <!-- Dim Shadow Backdrop Overlay Component -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Left Side Slide-out Drawer Navigation Panel Container -->
  <nav class="sidebar-nav" id="sidebarMenu">
    <div class="sidebar-header">
      <h2>Ahle Sunnah</h2>
      <!-- The X Button inside the Sidebar -->
      <button class="sidebar-close-btn" id="closeMenuBtn" aria-label="Close navigation menu">&times;</button>
    </div>
    <div class="sidebar-links">
      <a href="{{ 'index.html' | relative_url }}">Home</a>
      <a href="{{ 'about.html' | relative_url }}">About</a>
      <a href="{{ 'contact.html' | relative_url }}">Contact</a>
      <a href="{{ 'documents.html' | relative_url }}">Documents</a>
      <a href="{{ 'priv.html' | relative_url }}">Privacy Policy</a>
      <a href="{{ 'terms.html' | relative_url }}">Terms And Conditions</a>
    </div>
  </nav>

  <!-- Core Content Block Wrap -->
  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ 'now' | date: '%Y' }} Ahle Sunnah. All rights reserved.</p>
  </footer>

  <button id="backToTop" title="Go to top">↑</button>

  <!-- Integrated Menu Toggles & Back-To-Top Interaction Scripting Logic -->
  <script>
    // 1. Sidebar Panel Toggling Logic Mechanics
    const sidebarMenu = document.getElementById("sidebarMenu");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const openMenuBtn = document.getElementById("openMenuBtn");
    const closeMenuBtn = document.getElementById("closeMenuBtn");

    function openSidebar() {
      sidebarMenu.classList.add("is-open");
      sidebarOverlay.classList.add("is-visible");
      openMenuBtn.style.opacity = "0"; // Smoothly hide the ☰ icon behind the opening slider sheet
    }

    function closeSidebar() {
      sidebarMenu.classList.remove("is-open");
      sidebarOverlay.classList.remove("is-visible");
      openMenuBtn.style.opacity = "1"; // Return visibility to ☰ when drawer is dismissed
    }

    // Attach Event Triggers
    openMenuBtn.addEventListener("click", openSidebar);
    closeMenuBtn.addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    // 2. Back to Top Scroll Logic
    const backToTopButton = document.getElementById("backToTop");

    window.onscroll = function() {
      if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
        backToTopButton.style.display = "block";
      } else {
        backToTopButton.style.display = "none";
      }
    };

    backToTopButton.addEventListener("click", function() {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>

  <script>
      // --- 1. Variable Instantiations & Setup ---
  const searchTriggerBtn = document.getElementById('searchTriggerBtn');
  const searchOverlayPanel = document.getElementById('searchOverlayPanel');
  const closeSearchBtn = document.getElementById('closeSearchBtn');
  const customSearchInput = document.getElementById('customSearchInput');
  const clearSearchBtn = document.getElementById('clearSearchBtn');
  const dropdownSearchResults = document.getElementById('dropdownSearchResults');

  let searchDb = [];
  const isPostPage = window.location.pathname.includes('/202') || !!document.querySelector('.post-content, article');

  // Load catalog maps safely
  fetch("{{ '/search.json' | relative_url }}")
    .then(res => res.json())
    .then(data => { searchDb = data; })
    .catch(err => console.error("Database initialization connection error: ", err));

  // --- 2. Interactive Toggle Actions ---
  if (searchTriggerBtn) {
    searchTriggerBtn.addEventListener('click', () => {
      if (searchOverlayPanel) searchOverlayPanel.classList.add('is-active');
      setTimeout(() => { if (customSearchInput) customSearchInput.focus(); }, 150);
    });
  }

  function closeSearchPanel() {
    if (searchOverlayPanel) searchOverlayPanel.classList.remove('is-active');
    if (customSearchInput) customSearchInput.value = '';
    if (clearSearchBtn) clearSearchBtn.style.display = 'none'; // Fixed structural bug: completely removed .close property
    if (dropdownSearchResults) dropdownSearchResults.innerHTML = '';
    removeHighlights();
  }

  if (closeSearchBtn) closeSearchBtn.addEventListener('click', closeSearchPanel);

  if (clearSearchBtn) {
    clearSearchBtn.addEventListener('click', () => {
      if (customSearchInput) {
        customSearchInput.value = '';
        customSearchInput.focus();
      }
      clearSearchBtn.style.display = 'none';
      if (dropdownSearchResults) dropdownSearchResults.innerHTML = '';
      removeHighlights();
    });
  }

  // --- 3. Parsing Input Queries ---
  if (customSearchInput) {
    customSearchInput.addEventListener('input', function() {
      const query = this.value.toLowerCase().trim();
      if (clearSearchBtn) clearSearchBtn.style.display = query.length > 0 ? 'block' : 'none';
      if (dropdownSearchResults) dropdownSearchResults.innerHTML = '';

      if (query.length < 2) {
        removeHighlights();
        return;
      }

      highlightTextOnPage(query);

      const matches = searchDb.filter(item => item.title.toLowerCase().includes(query) || item.excerpt.toLowerCase().includes(query));
      if (matches.length > 0 && !isPostPage && dropdownSearchResults) {
        matches.forEach(item => {
          const link = document.createElement('a');
          link.href = item.url; 
          link.className = 'drop-res-item';
          link.style.display = 'block';
          link.style.padding = '12px 15px';
          link.style.borderBottom = '1px solid #f0f0f0';
          link.style.textDecoration = 'none';
          link.innerHTML = `<div style="font-weight:600;color:#145a32;font-size:0.95rem;">${item.title}</div>`;
          dropdownSearchResults.appendChild(link);
        });
      }
    });
  }

  // --- 4. Deep Target Text Block DOM Scanners ---
  function highlightTextOnPage(keyword) {
    removeHighlights();
    const targetArea = document.querySelector('.post-content') || document.querySelector('article') || document.querySelector('.site-main');
    if (!targetArea) return;

    const walk = document.createTreeWalker(targetArea, NodeFilter.SHOW_TEXT, null, false);
    const textNodes = [];
    while (walk.nextNode()) textNodes.push(walk.currentNode);

    textNodes.forEach(node => {
      const parent = node.parentNode;
      if (!parent || parent.tagName === 'SCRIPT' || parent.tagName === 'STYLE' || parent.classList.contains('search-highlight')) return;

      const text = node.nodeValue;
      const lowerText = text.toLowerCase();
      
      if (lowerText.includes(keyword)) {
        const span = document.createElement('span');
        span.className = 'search-highlight-container';
        
        let html = '';
        let lastIndex = 0;
        let index = lowerText.indexOf(keyword);
        
        while (index !== -1) {
          html += escapeHtml(text.substring(lastIndex, index));
          html += `<mark class="search-highlight">${escapeHtml(text.substring(index, index + keyword.length))}</mark>`;
          lastIndex = index + keyword.length;
          index = lowerText.indexOf(keyword, lastIndex);
        }
        html += escapeHtml(text.substring(lastIndex));
        
        span.innerHTML = html;
        parent.replaceChild(span, node);
      }
    });
  }

  function removeHighlights() {
    document.querySelectorAll('.search-highlight-container').forEach(span => {
      const parent = span.parentNode;
      if (parent) {
        parent.replaceChild(document.createTextNode(span.textContent), span);
        parent.normalize();
      }
    });
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // --- 5. Sidebar Menu Controls Linkage ---
  const sidebarMenu = document.getElementById("sidebarMenu");
  const sidebarOverlay = document.getElementById("sidebarOverlay");
  const openMenuBtn = document.getElementById("openMenuBtn");
  const closeMenuBtn = document.getElementById("closeMenuBtn");

  if (openMenuBtn) {
    openMenuBtn.addEventListener("click", () => {
      if (sidebarMenu) sidebarMenu.classList.add("is-open");
      if (sidebarOverlay) sidebarOverlay.classList.add("is-visible");
      openMenuBtn.style.opacity = "0";
    });
  }

  if (closeMenuBtn) {
    closeMenuBtn.addEventListener("click", () => {
      if (sidebarMenu) sidebarMenu.classList.remove("is-open");
      if (sidebarOverlay) sidebarOverlay.classList.remove("is-visible");
      if (openMenuBtn) openMenuBtn.style.opacity = "1";
    });
  }

  if (sidebarOverlay) {
    sidebarOverlay.addEventListener("click", () => {
      if (sidebarMenu) sidebarMenu.classList.remove("is-open");
      sidebarOverlay.classList.remove("is-visible");
      if (openMenuBtn) openMenuBtn.style.opacity = "1";
    });
  }

  // --- 6. Scroll Up Target Logic Interceptors ---
  const backToTopButton = document.getElementById("backToTop");
  window.onscroll = function() {
    if (backToTopButton) {
      if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
        backToTopButton.style.display = "block";
      } else {
        backToTopButton.style.display = "none";
      }
    }
  };
  if (backToTopButton) {
    backToTopButton.addEventListener("click", function() {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  </script>

  


</body>
</html>
