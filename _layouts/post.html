---
layout: default
---
<article class="single-post">
  <header class="post-header">
    <a class="back-link" href="{{ "/" | relative_url }}">← Back to all posts</a>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time>{{ page.date | date: "%A, %B %d, %Y" }}</time>
      {% if page.author %}<span>• {{ page.author }}</span>{% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <div class="share-note">Share the khair — فذكر فإن الذكرى تنفع المؤمنين</div>
  </footer>
</article>
