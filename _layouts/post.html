---
layout: default
---
<style>
  /* Fixes Blogger external images overflowing on screen sides */
  .post-content img,
  article img,
  .entry-content img {
    max-width: 100% !important;
    height: auto !important;
    display: block !important;
    margin: 20px auto !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1); /* Adds a subtle clean border to scan outlines */
  }
</style>

<article class="post-full">
  <div class="post-meta">
    <time>{{ page.date | date: "%B %d, %Y" }}</time>
    {% if page.tags %}{% for tag in page.tags %}<span class="label">{{ tag }}</span>{% endfor %}{% endif %}
  </div>
  <h1>{{ page.title }}</h1>
  <div class="post-content">
    {{ content }}
  </div>
  <div class="post-nav">
    <a href="{{ '/' | relative_url }}">&larr; Back to all posts</a>
  </div>
</article>
