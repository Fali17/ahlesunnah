---
layout: default
---
<article class="post-full">
  <h1>{{ page.title }}</h1>
  <div class="meta">
    <time>{{ page.date | date: "%B %d, %Y" }}</time>
    {% if page.tags %}
      · {% for tag in page.tags %}<span class="label">{{ tag }}</span>{% if forloop.last == false %} {% endif %}{% endfor %}
    {% endif %}
  </div>
  <div class="content">
    {{ content }}
  </div>
  <div style="margin-top:32px; padding-top:20px; border-top:1px solid var(--border);">
    <a href="{{ '/' | relative_url }}" class="read-more">← Back to all articles</a>
  </div>
</article>
