---
layout: default
---
{% for post in site.posts %}
  <article class="post-card">
    <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    <div class="meta">{{ post.date | date: "%b %d, %Y" }}</div>
    <p>{{ post.excerpt | strip_html | truncate: 160 }}</p>
  </article>
{% endfor %}
