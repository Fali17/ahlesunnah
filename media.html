---
layout: page
title: Media Gallery
permalink: media
---

<!-- 1. CSS VISUAL STYLES -->
<style>
  /* Make gallery wider than normal posts */
  .site-main {
    max-width: 1200px !important;
  }

  .media-gallery-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 4px 20px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  .latest-media-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 36px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .latest-title {
    font-family: 'Amiri', serif;
    font-size: 1.55rem;
    margin: 0 0 16px;
    color: var(--text);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 6px;
    display: inline-block;
  }

  .media-card.latest-card {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  @media (min-width: 768px) {
    .media-card.latest-card {
      flex-direction: row;
      align-items: center;
    }
    .latest-img-wrapper {
      flex: 1;
      max-width: 48%;
    }
    .latest-info-wrapper {
      flex: 1;
    }
  }

  .latest-img-wrapper img {
    width: 100%;
    height: auto;
    max-height: 380px;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    background: #f8f6f0;
    cursor: pointer;
  }

  .media-date {
    font-size: 0.82rem;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }

  .caption-link {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--primary);
    text-decoration: none;
    line-height: 1.4;
    transition: color 0.2s ease;
  }

  .caption-link:hover {
    color: var(--primary-dark);
    text-decoration: underline;
  }

  .gallery-title {
    font-family: 'Amiri', serif;
    font-size: 1.6rem;
    color: var(--text);
    margin: 0 0 20px;
  }

  .media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
    margin-bottom: 28px;
  }

  .grid-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  .grid-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  }

  .grid-img-wrapper {
    height: 190px;
    overflow: hidden;
    background: #f5f3eb;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .grid-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .grid-card .caption-link {
    font-size: 0.92rem;
    color: var(--text);
    font-weight: 500;
  }

  .grid-card .caption-link:hover {
    color: var(--primary);
  }

  /* Pagination – matches your site buttons */
  .pagination-controls-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 18px 0 10px;
    margin-top: 12px;
    font-size: 0.95rem;
    color: var(--text);
  }

  .pagination-controls-wrapper button {
    min-width: 110px;
    padding: 10px 18px;
    font-size: 0.92rem;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--primary);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .pagination-controls-wrapper button:hover:not(:disabled) {
    background: color-mix(in srgb, var(--primary) 8%, white);
    border-color: var(--primary);
  }

  .pagination-controls-wrapper button:disabled {
    color: var(--muted);
    background: #f5f3eb;
    border-color: var(--border);
    cursor: not-allowed;
    opacity: 0.65;
  }

  .page-info-panel {
    font-weight: 500;
    color: var(--muted);
  }

/* ========== GLIGHTBOX – FORCE PROPER SIZING ========== */

/* Full-screen dark overlay */
.glightbox-container {
  z-index: 99999 !important;
}

/* Center everything */
.glightbox-container .gslide,
.glightbox-container .gslide-inner,
.glightbox-container .ginner-container {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  height: 100% !important;
  width: 100% !important;
  max-width: 100vw !important;
  max-height: 100vh !important;
}

/* Media / image wrapper */
.glightbox-container .gslide-media,
.glightbox-container .gslide-image,
.glightbox-container .gslide-image .gslide-media {
  max-width: 100vw !important;
  max-height: 100vh !important;
  width: auto !important;
  height: auto !important;
  margin: 0 auto !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}

/* The actual image – this is the important part */
.glightbox-container .gslide-image img,
.glightbox-container .gslide-media img,
.glightbox-container img.gslide-image {
  max-width: 96vw !important;
  max-height: 88vh !important;   /* leaves room for description + close button */
  width: auto !important;
  height: auto !important;
  object-fit: contain !important;
  display: block !important;
  margin: 0 auto !important;
}

/* Desktop – more room */
@media (min-width: 769px) {
  .glightbox-container .gslide-image img,
  .glightbox-container .gslide-media img {
    max-width: 92vw !important;
    max-height: 90vh !important;
  }
}

/* Mobile – slightly less height so description doesn’t push image off-screen */
@media (max-width: 768px) {
  .glightbox-container .gslide-image img,
  .glightbox-container .gslide-media img {
    max-width: 98vw !important;
    max-height: 78vh !important;
  }
}

/* Description under the image */
.glightbox-container .gslide-description,
.glightbox-container .gdesc-inner {
  max-width: 90vw !important;
  margin: 10px auto 0 !important;
  text-align: center !important;
  background: rgba(0, 0, 0, 0.7) !important;
  color: #fff !important;
  padding: 8px 14px !important;
  border-radius: 8px !important;
  font-size: 0.95rem !important;
  line-height: 1.4 !important;
}

/* Close button – bigger and always visible */
.gclose {
  width: 44px !important;
  height: 44px !important;
  background: rgba(0, 0, 0, 0.65) !important;
  border-radius: 50% !important;
  top: 14px !important;
  right: 14px !important;
  opacity: 1 !important;
  z-index: 100000 !important;
  transition: all 0.2s ease !important;
}
.gclose:hover {
  background: rgba(0, 0, 0, 0.9) !important;
  transform: scale(1.1);
}
.gclose svg {
  width: 22px !important;
  height: 22px !important;
}
@media (max-width: 768px) {
  .gclose {
    top: 10px !important;
    right: 10px !important;
    width: 40px !important;
    height: 40px !important;
  }
}
</style>

<!-- GLightbox Plugin Assets -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<!-- 3. LAYOUT VIEW CONTEXT -->
<div class="media-gallery-container">
  
  <!-- Latest Image Box -->
  <div class="latest-media-section">
    <h2 class="latest-title">Latest Upload</h2>
    <div id="latest-image-target">Searching for latest file...</div>
  </div>

  <!-- Global Image Grid -->
  <h2 class="gallery-title">All Website Media</h2>
  <div id="media-grid-target" class="media-grid">
    Generating media library...
  </div>

  <!-- Dynamic Pagination Navigation -->
  <div class="pagination-controls-wrapper" id="pagination-controls-element" style="display: none;">
    <button id="prevBtn" disabled>&laquo; Previous</button>
    <span class="page-info-panel" id="pageInfo"></span>
    <button id="nextBtn">Next &raquo;</button>
  </div>
</div>

<!-- 4. RAW STRUCTURAL DATA GENERATOR (HIDDEN DATA POOL) -->
<div id="jekyll-raw-content-vault" style="display: none;">
  {% for post in site.posts %}
    <div class="vault-item" 
         data-url="{{ post.url | relative_url }}" 
         data-date="{{ post.date | date: '%B %d, %Y' }}" 
         data-title="{{ post.title | escape }}">
      <div class="post-html-payload">
        {{ post.content }}
      </div>
    </div>
  {% endfor %}
</div>

<!-- 5. CLIENT JAVASCRIPT SCANNER ENGINE -->
<script>
document.addEventListener("DOMContentLoaded", function() {

  // Safe extraction utility to isolate base path without crashing on query hashes
  function getCleanPathString(url) {
    if (!url) return '';
    let fragmentClean = url.split('#')[0];
    let queryClean = fragmentClean.split('?')[0];
    return queryClean.trim();
  }

  // Deterministic standard hash generator using image source strings directly
  function generateCleanImageHash(rawSrc) {
    let cleanUrl = getCleanPathString(rawSrc);
    if (!cleanUrl) return 'img-null';
    let hash = 0;
    for (let i = 0; i < cleanUrl.length; i++) {
      hash = ((hash << 5) - hash) + cleanUrl.charCodeAt(i);
      hash |= 0; // Convert to 32bit integer
    }
    return 'img-ref-' + Math.abs(hash);
  }

  const posts = document.querySelectorAll('#jekyll-raw-content-vault .vault-item');
  const gridContainer = document.getElementById('media-grid-target');
  const latestContainer = document.getElementById('latest-image-target');
  const paginationControls = document.getElementById('pagination-controls-element');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageInfo = document.getElementById('pageInfo');
  
  let collectedImages = [];
  const imagesPerPage = 10; // Strictly 10 images per page
  let currentPage = 0;

  // Process Jekyll output payload structures
  posts.forEach((postElement) => {
    const postUrl = postElement.getAttribute('data-url');
    const postDate = postElement.getAttribute('data-date');
    const postTitle = postElement.getAttribute('data-title');
    const htmlPayload = postElement.querySelector('.post-html-payload');
    const images = htmlPayload.querySelectorAll('img');
    
    images.forEach((img) => {
      let src = img.getAttribute('src');
      if (!src || src.startsWith('data:')) return;
      src = src.trim();

      // Build stable unique target signature ID
      const matchingHashId = generateCleanImageHash(src);
      let postLink = postUrl + "#" + matchingHashId;
      
      let foundCaption = img.getAttribute('alt') || img.getAttribute('title');
      
      const nextSibling = img.nextElementSibling;
      if (nextSibling && (nextSibling.tagName === 'P' || nextSibling.tagName === 'FIGCAPTION')) {
        if (nextSibling.textContent.trim().length > 1) {
          foundCaption = nextSibling.textContent.trim();
        }
      }
      
      if (!foundCaption || foundCaption.trim() === "") {
        foundCaption = `Image from post: "${postTitle}"`;
      }

      collectedImages.push({
        src: src,
        caption: foundCaption,
        deepLinkUrl: postLink,
        dateString: postDate
      });
    });
  });

  // Empty view targets prior to population
  gridContainer.innerHTML = '';
  latestContainer.innerHTML = '';

  if (collectedImages.length === 0) {
    latestContainer.innerHTML = '<p style="color: #666;">No valid image paths discovered across posts.</p>';
    gridContainer.innerHTML = '<p style="color: #666;">Gallery empty.</p>';
    return;
  }

 const lightbox = GLightbox({
  loop: true,
  descPosition: 'bottom',
  closeButton: true,
  touchNavigation: true,
  keyboardNavigation: true,
  closeOnOutsideClick: true,
  openEffect: 'fade',
  closeEffect: 'fade',
  zoomable: true,
  draggable: true,
  moreLength: 0,           // don’t truncate descriptions
  // Important: stop GLightbox from forcing fixed sizes
  skin: 'clean'
});

  // A. POPULATE LATEST UPLOAD CARD (Chronologically first item)
  const latestImg = collectedImages[0];
  latestContainer.innerHTML = `
    <div class="media-card latest-card">
      <div class="latest-img-wrapper">
        <a href="${latestImg.src}" class="glightbox" data-description="${latestImg.caption}">
          <img src="${latestImg.src}" alt="${latestImg.caption}">
        </a>
      </div>
      <div class="latest-info-wrapper">
        <span class="media-date">Published: ${latestImg.dateString}</span>
        <a href="${latestImg.deepLinkUrl}" class="caption-link">
          ${latestImg.caption} &rarr;
        </a>
        <p style="margin-top: 10px; font-size: 0.9rem; color: #666;">
          Tapping this caption jumps directly to where this image lives inside the article body.
        </p>
      </div>
    </div>
  `;

  // B. RENDER PAGINATED GALLERY
  function displayGalleryPage() {
    gridContainer.innerHTML = '';
    
    const startIndex = currentPage * imagesPerPage;
    const endIndex = startIndex + imagesPerPage;
    const currentImagesSubset = collectedImages.slice(startIndex, endIndex);
    
    currentImagesSubset.forEach(item => {
      const cardElement = document.createElement('div');
      cardElement.className = 'grid-card';
      cardElement.innerHTML = `
        <div class="grid-img-wrapper">
          <a href="${item.src}" class="glightbox" data-description="${item.caption}">
            <img src="${item.src}" alt="${item.caption}" loading="lazy">
          </a>
        </div>
        <span class="media-date">${item.dateString}</span>
        <a href="${item.deepLinkUrl}" class="caption-link" title="Jump straight to item view location">
          ${item.caption}
        </a>
      `;
      gridContainer.appendChild(cardElement);
    });

    // Refresh lightbox after injecting new elements
    lightbox.reload();

    // Update pagination info
    const totalPagesCount = Math.ceil(collectedImages.length / imagesPerPage);
    pageInfo.textContent = `Page ${currentPage + 1} of ${totalPagesCount} (${collectedImages.length} images total)`;
    
    prevBtn.disabled = (currentPage === 0);
    nextBtn.disabled = (currentPage >= totalPagesCount - 1);
  }

  // Show pagination controls and render first page
  if (collectedImages.length > 0) {
    paginationControls.style.display = 'flex';
    displayGalleryPage();
  }

  // Navigation event listeners
  prevBtn.addEventListener('click', function() {
    if (currentPage > 0) {
      currentPage--;
      displayGalleryPage();
      gridContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  nextBtn.addEventListener('click', function() {
    if (currentPage < Math.ceil(collectedImages.length / imagesPerPage) - 1) {
      currentPage++;
      displayGalleryPage();
      gridContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
});

// Second script: Deep-link handling for individual post pages
document.addEventListener("DOMContentLoaded", function() {
  let currentPath = window.location.pathname;
  if (currentPath.includes('/media/') || currentPath.endsWith('/media.html')) return;

  function getCleanPathString(url) {
    if (!url) return '';
    let fragmentClean = url.split('#')[0];
    let queryClean = fragmentClean.split('?')[0];
    return queryClean.trim();
  }

  function generateCleanImageHash(rawSrc) {
    let cleanUrl = getCleanPathString(rawSrc);
    if (!cleanUrl) return 'img-null';
    let hash = 0;
    for (let i = 0; i < cleanUrl.length; i++) {
      hash = ((hash << 5) - hash) + cleanUrl.charCodeAt(i);
      hash |= 0;
    }
    return 'img-ref-' + Math.abs(hash);
  }

  // Attach unique IDs and scroll margin to images on article pages
  const articleImages = document.querySelectorAll('img');
  articleImages.forEach(img => {
    let src = img.getAttribute('src') || '';
    if (!src || src.startsWith('data:')) return;

    let uniqueHashSignature = img.getAttribute('id') || generateCleanImageHash(src);
    img.setAttribute('id', uniqueHashSignature);

    // Offset for sticky headers
    img.style.scrollMarginTop = '120px';
  });

  // Scroll to hash target on load
  if (window.location.hash) {
    const activeFragmentId = decodeURIComponent(window.location.hash.substring(1));
    setTimeout(() => {
      const targetElement = document.getElementById(activeFragmentId);
      if (targetElement) {
        targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }, 550);
  }
});
</script>
