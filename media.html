---
layout: default
title: Media Gallery
permalink:media 
---

<style>
  .image-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .image-gallery figure {
    margin: 0;
    border-radius: 10px;
    overflow: hidden;
    border: 3px solid #145a32;               /* Green border around the card */
    box-shadow: 0 4px 12px rgba(20, 90, 50, 0.15);
    display: flex;
    flex-direction: column;
    transition: all 0.3s ease;
    background: #ffffff;
  }

  .image-gallery figure:hover {
    box-shadow: 0 8px 20px rgba(20, 90, 50, 0.25);
    transform: translateY(-3px);
  }

  .image-gallery a.glight {
    display: block;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    border-bottom: 2px solid #145a32;        /* Green line under the image */
  }

  .image-gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .image-gallery figcaption {
    padding: 14px 10px;
    text-align: center;
    font-size: 0.95em;
    flex-grow: 1;
    background: #ffffff;
    color: #145a32 !important;               /* Green text */
    border-top: 1px solid #d5f5e3;
  }

  .image-gallery figcaption a {
    color: #145a32 !important;               /* Green links */
    text-decoration: none;
    display: block;
    font-weight: 600;
  }

  .image-gallery figcaption a:hover {
    text-decoration: underline;
    color: #0d2818 !important;
  }

  #pagination-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 25px 15px;
    font-size: 1.1em;
    font-weight: bold;
    color: #145a32;
    flex-wrap: nowrap;          
  }

  #pagination-controls button {
    min-width: 130px;
    padding: 12px 24px;
    font-size: 1.05em;
    border: 2px solid #145a32;
    border-radius: 12px;
    background: #145a32;
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(20, 90, 50, 0.2);
    transition: all 0.3s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  #pagination-controls button:hover:not(:disabled) {
    background: #0d2818;
    border-color: #0d2818;
    transform: translateY(-2px);
  }

  #pagination-controls button:disabled {
    background: #c8e6c9;
    border-color: #a5d6a7;
    color: #a5d6a7;
    opacity: 0.7;
    box-shadow: none;
    cursor: not-allowed;
  }

  #pageInfo {
    white-space: nowrap;
    flex-shrink: 1;
    text-align: center;
  }

  /* ===== TABLET ONLY ===== */
  @media (max-width: 900px) and (min-width: 601px) {
    #pagination-controls {
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    #pageInfo {
      width: 100%;
      order: -1;               
      margin-bottom: 4px;
    }
  }

  /* ===== MOBILE ===== */
  @media (max-width: 600px) {
    .image-gallery {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }

    #pagination-controls {
      flex-direction: column;
      gap: 12px;
    }

    #pageInfo {
      order: -1;
    }
  }
</style>

<!-- GLightbox CSS -->
<link href="https://jsdelivr.net" rel="stylesheet">

<p style="text-align: center; color: #145a32; font-weight: 500;">
  Click thumbnail to enlarge • Click caption text to view the matching document article.
</p>

<!-- Gallery Target Container -->
<div class="image-gallery" id="imageGallery"></div>

<!-- Pagination Panel -->
<div id="pagination-controls">
  <button id="prevBtn" disabled>&laquo; Previous</button>
  <span id="pageInfo"></span>
  <button id="nextBtn">Next &raquo;</button>
</div>

<!-- Hidden temporary element for parsing generated posts data via liquid -->
<div id="liquid-post-data" style="display: none;">
  {% for post in site.posts %}
    <article data-url="{{ post.url | relative_url }}" data-title="{{ post.title | escape }}">
      {{ post.content }}
    </article>
  {% endfor %}
</div>

<!-- GLightbox JS Core -->
<script src="https://jsdelivr.net"></script>

<script type="text/javascript">
//<![CDATA[
document.addEventListener("DOMContentLoaded", function() {
  
  // Initialize Lightbox Instance
  const lightbox = GLightbox({
    loop: true,
    descPosition: 'bottom'
  });

  const allImages = [];
  const seen = new Set();
  
  // Extract images out of the rendered markdown post structures compiled by Jekyll
  const postContainers = document.querySelectorAll('#liquid-post-data article');
  
  postContainers.forEach(function(article) {
    const postUrl = article.getAttribute('data-url');
    const postTitle = article.getAttribute('data-title');
    const imgs = article.querySelectorAll('img');

    imgs.forEach(function(img) {
      const src = img.src ? img.src.trim() : '';
      if (!src || seen.has(src)) return;
      
      // Keep track to prevent duplicate images showing up in the gallery
      seen.add(src);

      const altTextRaw = (img.getAttribute('alt') || '').trim();
      const altText = altTextRaw || postTitle;
      const imgIdRaw = img.getAttribute('id') || '';
      const imgId = imgIdRaw.trim();

      const postLink = imgId ? postUrl + '#' + imgId : postUrl;

      // Handle standard Blogspot resolution transformations for responsive sizing
      let thumbSrc = src.replace(/\/s\d+-?\w*\//gi, '/s400-c/').replace(/=s\d+/g, '=s400-c');
      let fullSrc = src.replace(/\/s\d+-?\w*\//gi, '/s1600/').replace(/=s\d+/g, '=s1600');

      if (thumbSrc === src) thumbSrc = src + (src.includes('?') ? '&' : '?') + '=s400-c';
      if (fullSrc === src) fullSrc = src + (src.includes('?') ? '&' : '?') + '=s1600';

      allImages.push({
        thumbSrc: thumbSrc,
        fullSrc: fullSrc,
        caption: altText,
        postLink: postLink
      });
    });
  });

  // Clean out the hidden template tags from DOM tree once extraction completes
  document.getElementById('liquid-post-data').remove();

  const galleryDiv = document.getElementById('imageGallery');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageInfo = document.getElementById('pageInfo');
  
  const imagesPerPage = 12; 
  let currentPage = 0;

  function renderGallery() {
    const start = currentPage * imagesPerPage;
    const end = start + imagesPerPage;
    const pageImages = allImages.slice(start, end);

    let html = '';
    if (pageImages.length === 0) {
      html = '<p style="grid-column: 1 / -1; text-align:center; color:#145a32; font-weight: bold;">No images found in your collection.</p>';
    } else {
      pageImages.forEach(function(data) {
        html += `<figure>
          <a href="${data.fullSrc}" class="glight" data-description="${data.caption}">
            <img src="${data.thumbSrc}" alt="${data.caption}" loading="lazy">
          </a>
          <figcaption><a href="${data.postLink}">${data.caption}</a></figcaption>
        </figure>`;
      });
    }

    galleryDiv.innerHTML = html;
    lightbox.reload();

    const totalPages = Math.ceil(allImages.length / imagesPerPage);
    pageInfo.textContent = allImages.length ? `Page ${currentPage + 1} of ${totalPages} (${allImages.length} images total)` : '';
    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage >= totalPages - 1;
  }

  if (allImages.length === 0) {
    galleryDiv.innerHTML = '<p style="grid-column: 1 / -1; text-align:center; color:#145a32; font-weight: bold;">No images found.</p>';
    pageInfo.textContent = '';
  } else {
    renderGallery();
  }

  prevBtn.addEventListener('click', function() {
    if (currentPage > 0) {
      currentPage--;
      renderGallery();
      galleryDiv.scrollIntoView({ behavior: 'smooth' });
    }
  });

  nextBtn.addEventListener('click', function() {
    if (currentPage < Math.ceil(allImages.length / imagesPerPage) - 1) {
      currentPage++;
      renderGallery();
      galleryDiv.scrollIntoView({ behavior: 'smooth' });
    }
  });
});
//]]>
</script>
