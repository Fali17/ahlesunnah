---
layout: page
title: Media Gallery
permalink: media
---

<style>
  /* Make gallery wider */
  .site-main {
    max-width: 1300px !important;
  }

  .media-gallery-container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 0 12px 40px;
  }

  /* ========== LATEST UPLOAD ========== */
  .latest-media-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 5px solid var(--accent);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 40px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .latest-title {
    font-family: 'Amiri', serif;
    font-size: 1.55rem;
    margin: 0 0 18px;
    color: var(--text);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 6px;
    display: inline-block;
  }

  .media-card.latest-card {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  @media (min-width: 768px) {
    .media-card.latest-card {
      flex-direction: row;
      align-items: center;
    }
    .latest-img-wrapper {
      flex: 0 0 42%;
      max-width: 420px;
    }
  }

  .latest-img-wrapper a {
    display: block;
    border-radius: 12px;
    overflow: hidden;
    border: 3px solid var(--primary);
    box-shadow: 0 4px 14px rgba(14, 74, 45, 0.15);
  }

  .latest-img-wrapper img {
    width: 100%;
    height: auto;
    max-height: 360px;
    object-fit: contain;
    display: block;
    background: #f8f6f0;
  }

  .media-date {
    font-size: 0.82rem;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }

  .caption-link {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--primary);
    text-decoration: none;
    line-height: 1.4;
  }
  .caption-link:hover {
    color: var(--primary-dark);
    text-decoration: underline;
  }

  /* ========== MAIN GALLERY ========== */
  .gallery-title {
    font-family: 'Amiri', serif;
    font-size: 1.6rem;
    color: var(--text);
    margin: 0 0 8px;
  }

  .gallery-hint {
    text-align: center;
    color: var(--primary);
    font-size: 0.95rem;
    margin: 0 0 24px;
    opacity: 0.9;
  }

  .media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
    margin-bottom: 32px;
  }

  @media (max-width: 600px) {
    .media-grid {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
  }

  /* Clean card style */
  .grid-card {
    margin: 0;
    background: var(--card);
    border: 3px solid var(--primary);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 12px rgba(14, 74, 45, 0.12);
    transition: all 0.25s ease;
  }

  .grid-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(14, 74, 45, 0.2);
  }

  .grid-card a.image-link {
    display: block;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-bottom: 2px solid var(--primary);
    background: #f5f3eb;
  }

  .grid-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }

  .grid-card:hover img {
    transform: scale(1.05);
  }

  .grid-card figcaption {
    padding: 12px 10px;
    text-align: center;
    flex-grow: 1;
    background: #fff;
    border-top: 1px solid #e8f0e9;
  }

  .grid-card .media-date {
    margin-bottom: 4px;
    font-size: 0.78rem;
  }

  .grid-card .caption-link {
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--primary) !important;
    display: block;
    line-height: 1.35;
  }
  .grid-card .caption-link:hover {
    color: var(--primary-dark) !important;
    text-decoration: underline;
  }

  /* ========== PAGINATION ========== */
  .pagination-controls-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 20px 0 10px;
    flex-wrap: wrap;
  }

  .pagination-controls-wrapper button {
    min-width: 120px;
    padding: 11px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    border: 2px solid var(--primary);
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .pagination-controls-wrapper button:hover:not(:disabled) {
    background: var(--primary-dark);
    border-color: var(--primary-dark);
    transform: translateY(-2px);
  }

  .pagination-controls-wrapper button:disabled {
    background: #c8e6c9;
    border-color: #a5d6a7;
    color: #7a9e7c;
    cursor: not-allowed;
    opacity: 0.75;
  }

  .page-info-panel {
    font-weight: 600;
    color: var(--primary);
    white-space: nowrap;
  }

  @media (max-width: 600px) {
    .pagination-controls-wrapper {
      flex-direction: column;
      gap: 12px;
    }
    .page-info-panel {
      order: -1;
    }
  }
</style>

<div class="media-gallery-container">

  <!-- Latest Upload -->
  <div class="latest-media-section">
    <h2 class="latest-title">Latest Upload</h2>
    <div id="latest-image-target">Searching for latest file...</div>
  </div>

  <!-- Gallery -->
  <h2 class="gallery-title">All Website Media</h2>
  <p class="gallery-hint">
    Click the image to open it full-size • Click the caption to go to the original post
  </p>

  <div id="media-grid-target" class="media-grid">
    Generating media library...
  </div>

  <!-- Pagination -->
  <div class="pagination-controls-wrapper" id="pagination-controls-element" style="display: none;">
    <button id="prevBtn" disabled>&laquo; Previous</button>
    <span class="page-info-panel" id="pageInfo"></span>
    <button id="nextBtn">Next &raquo;</button>
  </div>
</div>

<!-- Hidden data vault -->
<div id="jekyll-raw-content-vault" style="display: none;">
  {% for post in site.posts %}
    <div class="vault-item" 
         data-url="{{ post.url | relative_url }}" 
         data-date="{{ post.date | date: '%B %d, %Y' }}" 
         data-title="{{ post.title | escape }}">
      <div class="post-html-payload">
        {{ post.content }}
      </div>
    </div>
  {% endfor %}
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

  function getCleanPathString(url) {
    if (!url) return '';
    return url.split('#')[0].split('?')[0].trim();
  }

  function generateCleanImageHash(rawSrc) {
    let cleanUrl = getCleanPathString(rawSrc);
    if (!cleanUrl) return 'img-null';
    let hash = 0;
    for (let i = 0; i < cleanUrl.length; i++) {
      hash = ((hash << 5) - hash) + cleanUrl.charCodeAt(i);
      hash |= 0;
    }
    return 'img-ref-' + Math.abs(hash);
  }

  function escapeAttr(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  const posts = document.querySelectorAll('#jekyll-raw-content-vault .vault-item');
  const gridContainer = document.getElementById('media-grid-target');
  const latestContainer = document.getElementById('latest-image-target');
  const paginationControls = document.getElementById('pagination-controls-element');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageInfo = document.getElementById('pageInfo');

  let collectedImages = [];
  const imagesPerPage = 10;
  let currentPage = 0;

  // Collect images from all posts
  posts.forEach((postElement) => {
    const postUrl = postElement.getAttribute('data-url');
    const postDate = postElement.getAttribute('data-date');
    const postTitle = postElement.getAttribute('data-title');
    const htmlPayload = postElement.querySelector('.post-html-payload');
    const images = htmlPayload.querySelectorAll('img');

    images.forEach((img) => {
      let src = img.getAttribute('src');
      if (!src || src.startsWith('data:')) return;
      src = src.trim();

      const matchingHashId = generateCleanImageHash(src);
      const postLink = postUrl + "#" + matchingHashId;

      let foundCaption = img.getAttribute('alt') || img.getAttribute('title') || '';

      const nextSibling = img.nextElementSibling;
      if (nextSibling && (nextSibling.tagName === 'P' || nextSibling.tagName === 'FIGCAPTION')) {
        if (nextSibling.textContent.trim().length > 1) {
          foundCaption = nextSibling.textContent.trim();
        }
      }

      if (!foundCaption || foundCaption.trim() === "") {
        foundCaption = `Image from post: "${postTitle}"`;
      }

      collectedImages.push({
        src: src,
        caption: foundCaption,
        deepLinkUrl: postLink,
        dateString: postDate
      });
    });
  });

  gridContainer.innerHTML = '';
  latestContainer.innerHTML = '';

  if (collectedImages.length === 0) {
    latestContainer.innerHTML = '<p style="color:#666;">No images found.</p>';
    gridContainer.innerHTML = '<p style="color:#666; grid-column:1/-1; text-align:center;">Gallery empty.</p>';
    return;
  }

  // Latest Upload
  const latestImg = collectedImages[0];
  latestContainer.innerHTML = `
    <div class="media-card latest-card">
      <div class="latest-img-wrapper">
        <a href="${latestImg.src}">
  <img src="${latestImg.src}" alt="${escapeAttr(latestImg.caption)}">
</a>
        </a>
      </div>
      <div class="latest-info-wrapper">
        <span class="media-date">Published: ${latestImg.dateString}</span>
        <a href="${latestImg.deepLinkUrl}" class="caption-link">
          ${escapeAttr(latestImg.caption)} →
        </a>
        <p style="margin-top:12px; font-size:0.9rem; color:#666;">
          Click the image to open it full-size • Click the caption to jump to the post
        </p>
      </div>
    </div>
  `;

  // Gallery pages
  function displayGalleryPage() {
    gridContainer.innerHTML = '';

    const start = currentPage * imagesPerPage;
    const end = start + imagesPerPage;
    const pageImages = collectedImages.slice(start, end);

    pageImages.forEach(item => {
      const card = document.createElement('figure');
      card.className = 'grid-card';
      card.innerHTML = `
        <a href="${item.src}" class="image-link">
  <img src="${item.src}" alt="${escapeAttr(item.caption)}" loading="lazy">
</a>
        </a>
        <figcaption>
          <span class="media-date">${item.dateString}</span>
          <a href="${item.deepLinkUrl}" class="caption-link" title="Jump to image in post">
            ${escapeAttr(item.caption)}
          </a>
        </figcaption>
      `;
      gridContainer.appendChild(card);
    });

    const totalPages = Math.ceil(collectedImages.length / imagesPerPage);
    pageInfo.textContent = `Page ${currentPage + 1} of ${totalPages} (${collectedImages.length} images)`;
    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage >= totalPages - 1;
  }

  paginationControls.style.display = 'flex';
  displayGalleryPage();

  prevBtn.addEventListener('click', () => {
    if (currentPage > 0) {
      currentPage--;
      displayGalleryPage();
      gridContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentPage < Math.ceil(collectedImages.length / imagesPerPage) - 1) {
      currentPage++;
      displayGalleryPage();
      gridContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
});

// Deep-link support on individual posts (unchanged)
document.addEventListener("DOMContentLoaded", function() {
  let currentPath = window.location.pathname;
  if (currentPath.includes('/media') || currentPath.endsWith('/media.html')) return;

  function getCleanPathString(url) {
    if (!url) return '';
    return url.split('#')[0].split('?')[0].trim();
  }

  function generateCleanImageHash(rawSrc) {
    let cleanUrl = getCleanPathString(rawSrc);
    if (!cleanUrl) return 'img-null';
    let hash = 0;
    for (let i = 0; i < cleanUrl.length; i++) {
      hash = ((hash << 5) - hash) + cleanUrl.charCodeAt(i);
      hash |= 0;
    }
    return 'img-ref-' + Math.abs(hash);
  }

  document.querySelectorAll('img').forEach(img => {
    let src = img.getAttribute('src') || '';
    if (!src || src.startsWith('data:')) return;

    let id = img.getAttribute('id') || generateCleanImageHash(src);
    img.setAttribute('id', id);
    img.style.scrollMarginTop = '120px';
  });

  if (window.location.hash) {
    const id = decodeURIComponent(window.location.hash.substring(1));
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 500);
  }
});
</script>
