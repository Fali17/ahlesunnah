<style>
  .image-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .image-gallery figure {
    margin: 0;
    border-radius: 10px;
    overflow: hidden;
    border: 3px solid #145a32;               /* Green border around the card */
    box-shadow: 0 4px 12px rgba(20, 90, 50, 0.15);
    display: flex;
    flex-direction: column;
    transition: all 0.3s ease;
    background: #ffffff;
  }

  .image-gallery figure:hover {
    box-shadow: 0 8px 20px rgba(20, 90, 50, 0.25);
    transform: translateY(-3px);
  }

  .image-gallery a.glight {
    display: block;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    border-bottom: 2px solid #145a32;        /* Green line under the image */
  }

  .image-gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .image-gallery figcaption {
    padding: 14px 10px;
    text-align: center;
    font-size: 0.95em;
    flex-grow: 1;
    background: #ffffff;
    color: #145a32 !important;               /* Green text */
    border-top: 1px solid #d5f5e3;
  }

  .image-gallery figcaption a {
    color: #145a32 !important;               /* Green links */
    text-decoration: none;
    display: block;
    font-weight: 600;
  }

  .image-gallery figcaption a:hover {
    text-decoration: underline;
    color: #0d2818 !important;
  }

  #pagination-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  padding: 25px 15px;
  font-size: 1.1em;
  font-weight: bold;
  color: #145a32;
  flex-wrap: nowrap;          /* Keep everything on one line by default */
}

#pagination-controls button {
  min-width: 130px;
  padding: 12px 24px;
  font-size: 1.05em;
  border: 2px solid #145a32;
  border-radius: 12px;
  background: #145a32;
  color: #ffffff;
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(20, 90, 50, 0.2);
  transition: all 0.3s;
  white-space: nowrap;
  flex-shrink: 0;
}

#pagination-controls button:hover:not(:disabled) {
  background: #0d2818;
  border-color: #0d2818;
  transform: translateY(-2px);
}

#pagination-controls button:disabled {
  background: #c8e6c9;
  border-color: #a5d6a7;
  color: #a5d6a7;
  opacity: 0.7;
  box-shadow: none;
  cursor: not-allowed;
}

#pageInfo {
  white-space: nowrap;
  flex-shrink: 1;
  text-align: center;
}

/* ===== TABLET ONLY ===== */
@media (max-width: 900px) and (min-width: 601px) {
  #pagination-controls {
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
  }

  #pageInfo {
    width: 100%;
    order: -1;               /* Page info goes on top */
    margin-bottom: 4px;
  }
}

/* ===== MOBILE ===== */
@media (max-width: 600px) {
  .image-gallery {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 15px;
  }

  #pagination-controls {
    flex-direction: column;
    gap: 12px;
  }

  #pageInfo {
    order: -1;
  }
}
  
</style>

<link href="https://cdn.jsdelivr.net/npm/glightbox@3/dist/css/glightbox.min.css" rel="stylesheet">

<p style="text-align: center; color: #145a32;">
  Click thumbnail to enlarge (your alt text shown below the image) • Click caption to open original post (scrolls to exact image if ID added)
</p>

<div class="image-gallery" id="imageGallery"></div>

<div id="pagination-controls">
  <button id="prevBtn" disabled>&laquo; Previous</button>
  <span id="pageInfo"></span>
  <button id="nextBtn">Next &raquo;</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/glightbox@3/dist/js/glightbox.min.js"></script>

<script>
  const lightbox = GLightbox({
    loop: true,
    descPosition: 'bottom'
  });
</script>

<script type="text/javascript">
//<![CDATA[
function showAllImages(json) {
  var entries = json.feed.entry || [];
  var allImages = [];
  var seen = new Set();

  entries.forEach(function(entry) {
    if (!entry.content) return;

    var postTitle = entry.title ? entry.title.$t : 'Untitled Post';
    postTitle = postTitle.replace(/"/g, '&quot;');

    var postUrl = '#';
    for (var j = 0; j < entry.link.length; j++) {
      if (entry.link[j].rel == 'alternate') {
        postUrl = entry.link[j].href;
        break;
      }
    }

    var content = entry.content.$t;
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = content;
    var imgs = tempDiv.querySelectorAll('img');

    imgs.forEach(function(img) {
      var src = img.src ? img.src.trim() : '';
      if (!src || seen.has(src)) return;
      if (!src.includes('blogspot.com') && !src.includes('googleusercontent.com')) return;

      seen.add(src);

      var altTextRaw = (img.getAttribute('alt') || '').trim();
      var altText = altTextRaw.replace(/"/g, '&quot;');
      var imgIdRaw = img.getAttribute('id') || '';
      var imgId = imgIdRaw.trim();

      var caption = altText || postTitle;
      var postLink = imgId ? postUrl + '#' + imgId : postUrl;

      var thumbSrc = src.replace(/\/s\d+-?\w*\//gi, '/s400-c/').replace(/=s\d+/g, '=s400-c');
      var fullSrc = src.replace(/\/s\d+-?\w*\//gi, '/s1600/').replace(/=s\d+/g, '=s1600');

      if (thumbSrc === src) thumbSrc = src + (src.includes('?') ? '&' : '?') + '=s400-c';
      if (fullSrc === src) fullSrc = src + (src.includes('?') ? '&' : '?') + '=s1600';

      allImages.push({
        thumbSrc: thumbSrc,
        fullSrc: fullSrc,
        caption: caption,
        postLink: postLink
      });
    });
  });

  const galleryDiv = document.getElementById('imageGallery');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageInfo = document.getElementById('pageInfo');
  const imagesPerPage = 10;
  let currentPage = 0;

  function renderGallery() {
    const start = currentPage * imagesPerPage;
    const end = start + imagesPerPage;
    const pageImages = allImages.slice(start, end);

    let html = '';
    if (pageImages.length === 0) {
      html = '<p style="grid-column: 1 / -1; text-align:center; color:#145a32;">No images found.</p>';
    } else {
      pageImages.forEach(function(data) {
        html += `<figure>
          <a href="${data.fullSrc}" class="glight" data-description="${data.caption}">
            <img src="${data.thumbSrc}" alt="${data.caption}" loading="lazy">
          </a>
          <figcaption><a href="${data.postLink}" target="_blank">${data.caption}</a></figcaption>
        </figure>`;
      });
    }

    galleryDiv.innerHTML = html;
    lightbox.reload();

    const totalPages = Math.ceil(allImages.length / imagesPerPage);
    pageInfo.textContent = allImages.length ? `Page ${currentPage + 1} of ${totalPages} (${allImages.length} images total)` : '';
    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage >= totalPages - 1;
  }

  if (allImages.length === 0) {
    galleryDiv.innerHTML = '<p style="grid-column: 1 / -1; text-align:center; color:#145a32;">No images found.</p>';
    pageInfo.textContent = '';
  } else {
    renderGallery();
  }

  prevBtn.addEventListener('click', function() {
    if (currentPage > 0) {
      currentPage--;
      renderGallery();
    }
  });

  nextBtn.addEventListener('click', function() {
    if (currentPage < Math.ceil(allImages.length / imagesPerPage) - 1) {
      currentPage++;
      renderGallery();
    }
  });
}
//]]>
</script>
