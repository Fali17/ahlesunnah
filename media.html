<style>
  .image-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .image-gallery figure {
    margin: 0;
    border-radius: 10px;
    overflow: hidden;
    border: 3px solid #145a32;               /* Green border around the card */
    box-shadow: 0 4px 12px rgba(20, 90, 50, 0.15);
    display: flex;
    flex-direction: column;
    transition: all 0.3s ease;
    background: #ffffff;
  }

  .image-gallery figure:hover {
    box-shadow: 0 8px 20px rgba(20, 90, 50, 0.25);
    transform: translateY(-3px);
  }

  .image-gallery a.glight {
    display: block;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    border-bottom: 2px solid #145a32;        /* Green line under the image */
  }

  .image-gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .image-gallery figcaption {
    padding: 14px 10px;
    text-align: center;
    font-size: 0.95em;
    flex-grow: 1;
    background: #ffffff;
    color: #145a32 !important;               /* Green text */
    border-top: 1px solid #d5f5e3;
  }

  .image-gallery figcaption a {
    color: #145a32 !important;               /* Green links */
    text-decoration: none;
    display: block;
    font-weight: 600;
  }

  .image-gallery figcaption a:hover {
    text-decoration: underline;
    color: #0d2818 !important;
  }

  #pagination-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 25px 15px;
    font-size: 1.1em;
    font-weight: bold;
    color: #145a32;
    flex-wrap: nowrap;
  }

  #pagination-controls button {
    min-width: 130px;
    padding: 12px 24px;
    font-size: 1.05em;
    border: 2px solid #145a32;
    border-radius: 12px;
    background: #145a32;
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(20, 90, 50, 0.2);
    transition: all 0.3s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  #pagination-controls button:hover:not(:disabled) {
    background: #0d2818;
    border-color: #0d2818;
    transform: translateY(-2px);
  }

  #pagination-controls button:disabled {
    background: #c8e6c9;
    border-color: #a5d6a7;
    color: #a5d6a7;
    opacity: 0.7;
    box-shadow: none;
    cursor: not-allowed;
  }

  #pageInfo {
    white-space: nowrap;
    flex-shrink: 1;
    text-align: center;
  }

  /* ===== TABLET ONLY ===== */
  @media (max-width: 900px) and (min-width: 601px) {
    #pagination-controls {
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    #pageInfo {
      width: 100%;
      order: -1;
      margin-bottom: 4px;
    }
  }

  /* ===== MOBILE ===== */
  @media (max-width: 600px) {
    .image-gallery {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }

    #pagination-controls {
      flex-direction: column;
      gap: 12px;
    }

    #pageInfo {
      order: -1;
    }
  }
</style>

<link href="https://jsdelivr.net" rel="stylesheet">

<p style="text-align: center; color: #145a32;">
  Click thumbnail to enlarge • Click caption underneath to view the post webpage and jump directly to that exact image position.
</p>

<div class="image-gallery" id="imageGallery"></div>

<div id="pagination-controls">
  <button id="prevBtn" disabled>&laquo; Previous</button>
  <span id="pageInfo"></span>
  <button id="nextBtn">Next &raquo;</button>
</div>

<script src="https://jsdelivr.net"></script>

<script type="text/javascript">
  // Unified, safe cleaning logic that extracts the base file path from URL strings
  function getCleanPath(url) {
    if (!url) return '';
    let step1 = url.split('#')[0];
    let step2 = step1.split('?')[0];
    return step2.trim();
  }

  // Deterministic ID hash generator mapping identical keys to matching images on both layouts
  function generateCleanImageHash(rawSrc) {
    let cleanString = getCleanPath(rawSrc);
    if (!cleanString) return 'img-null';
    let hash = 0;
    for (let i = 0; i < cleanString.length; i++) {
      hash = (hash << 5) - hash + cleanString.charCodeAt(i);
      hash |= 0;
    }
    return 'img-pos-' + Math.abs(hash);
  }

  const allImages = [
    {% for post in site.posts %}
      {% if post.content contains '<img' or post.content contains '![' %}
        (() => {
          const div = document.createElement('div');
          div.innerHTML = {{ post.content | jsonify }};
          const imgs = div.querySelectorAll('img');
          let parsedImages = [];
          
          imgs.forEach(img => {
            let src = img.getAttribute('src') || '';
            if (!src) return;
            src = src.trim();

            let altText = (img.getAttribute('alt') || '').trim();
            let caption = altText ? altText : {{ post.title | jsonify }};
            
            let targetId = img.getAttribute('id') || generateCleanImageHash(src);
            let postLink = "{{ post.url | relative_url }}#" + targetId;

            parsedImages.push({
              thumbSrc: src,
              fullSrc: src,
              caption: caption,
              postLink: postLink
            });
          });
          return parsedImages;
        })(),
      {% endif %}
    {% endfor %}
  ].flat().filter(Boolean);

  const lightbox = GLightbox({
    loop: true,
    descPosition: 'bottom'
  });

  const galleryDiv = document.getElementById('imageGallery');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageInfo = document.getElementById('pageInfo');
  const imagesPerPage = 12;
  let currentPage = 0;

  function renderGallery() {
    const start = currentPage * imagesPerPage;
    const end = start + imagesPerPage;
    const pageImages = allImages.slice(start, end);

    let html = '';
    if (pageImages.length === 0) {
      html = '<p style="grid-column: 1 / -1; text-align:center; color:#145a32;">No images found.</p>';
    } else {
      pageImages.forEach(function(data) {
        html += `<figure>
          <a href="${data.fullSrc}" class="glight" data-description="${data.caption}">
            <img src="${data.thumbSrc}" alt="${data.caption}" loading="lazy">
          </a>
          <figcaption><a href="${data.postLink}" target="_blank">${data.caption}</a></figcaption>
        </figure>`;
      });
    }

    galleryDiv.innerHTML = html;
    lightbox.reload();

    const totalPages = Math.ceil(allImages.length / imagesPerPage);
    pageInfo.textContent = allImages.length ? `Page ${currentPage + 1} of ${totalPages} (${allImages.length} images total)` : '';
    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage >= totalPages - 1;
  }

  if (allImages.length === 0) {
    galleryDiv.innerHTML = '<p style="grid-column: 1 / -1; text-align:center; color:#145a32;">No images found.</p>';
    pageInfo.textContent = '';
  } else {
    renderGallery();
  }

  prevBtn.addEventListener('click', function() {
    if (currentPage > 0) {
      currentPage--;
      renderGallery();
      window.scrollTo({ top: galleryDiv.offsetTop - 50, behavior: 'smooth' });
    }
  });

  nextBtn.addEventListener('click', function() {
    if (currentPage < Math.ceil(allImages.length / imagesPerPage) - 1) {
      currentPage++;
      renderGallery();
      window.scrollTo({ top: galleryDiv.offsetTop - 50, behavior: 'smooth' });
    }
  });
</script>

<!-- Global Post Document Script: Injects anchor targets with fixed header offsets inside standard article files -->
<script type="text/javascript">
  document.addEventListener("DOMContentLoaded", function() {
    let currentPath = window.location.pathname;
    if (currentPath.includes('/media/') || currentPath.endsWith('/media.html')) return;
    
    function getCleanPath(url) {
      if (!url) return '';
      let step1 = url.split('#')[0];
      let step2 = step1.split('?')[0];
      return step2.trim();
    }

    function generateCleanImageHash(rawSrc) {
      let cleanString = getCleanPath(rawSrc);
      if (!cleanString) return 'img-null';
      let hash = 0;
      for (let i = 0; i < cleanString.length; i++) {
        hash = (hash << 5) - hash + cleanString.charCodeAt(i);
        hash |= 0;
      }
      return 'img-pos-' + Math.abs(hash);
    }

    const postImages = document.querySelectorAll('img');
    postImages.forEach(img => {
      let src = img.getAttribute('src') || '';
      if (!src) return;
      
      let uniqueId = img.getAttribute('id') || generateCleanImageHash(src);
      
      // Inject visibility-hidden anchor elements directly prior to structural image tags
      if (!document.getElementById(uniqueId + '-anchor-tag')) {
        let anchor = document.createElement('a');
        anchor.id = uniqueId;
        anchor.className = 'media-gallery-anchor-tag';
        anchor.style.display = 'block';
        anchor.style.position = 'relative';
        anchor.style.top = '-140px'; /* Adjusted to comfortably clear any pinned sticky site navigation bars */
        anchor.style.visibility = 'hidden';
        
        img.parentNode.insertBefore(anchor, img);
      }
    });

    // Execute scroll focus routines safely
    if (window.location.hash) {
      const targetHashId = decodeURIComponent(window.location.hash.substring(1));
      
      // Check multiple delay thresholds to protect positions against lazy loading layout shifts
      const executionDelays = [200, 600, 1000, 1500];
      executionDelays.forEach(delay => {
        setTimeout(() => {
          const targetAnchor = document.getElementById(targetHashId);
          if (targetAnchor) {
            targetAnchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, delay);
      });
    }
  });
</script>
