<!-- 1. CSS VISUAL STYLES -->
<style>
  /* Make gallery wider than normal posts */
  .site-main {
    max-width: 1200px !important;
  }

  .media-gallery-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 4px 20px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  .latest-media-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 36px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .latest-title {
    font-family: 'Amiri', serif;
    font-size: 1.55rem;
    margin: 0 0 16px;
    color: var(--text);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 6px;
    display: inline-block;
  }

  .media-card.latest-card {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  @media (min-width: 768px) {
    .media-card.latest-card {
      flex-direction: row;
      align-items: center;
    }
    .latest-img-wrapper {
      flex: 1;
      max-width: 48%;
    }
    .latest-info-wrapper {
      flex: 1;
    }
  }

  .latest-img-wrapper img {
    width: 100%;
    height: auto;
    max-height: 380px;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    background: #f8f6f0;
    cursor: pointer;
  }

  .media-date {
    font-size: 0.82rem;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }

  .caption-link {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--primary);
    text-decoration: none;
    line-height: 1.4;
    transition: color 0.2s ease;
  }

  .caption-link:hover {
    color: var(--primary-dark);
    text-decoration: underline;
  }

  .gallery-title {
    font-family: 'Amiri', serif;
    font-size: 1.6rem;
    color: var(--text);
    margin: 0 0 20px;
  }

  .media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
    margin-bottom: 28px;
  }

  .grid-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  .grid-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  }

  .grid-img-wrapper {
    height: 190px;
    overflow: hidden;
    background: #f5f3eb;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .grid-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .grid-card .caption-link {
    font-size: 0.92rem;
    color: var(--text);
    font-weight: 500;
  }

  .grid-card .caption-link:hover {
    color: var(--primary);
  }

  /* Pagination – matches your site buttons */
  .pagination-controls-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 18px 0 10px;
    margin-top: 12px;
    font-size: 0.95rem;
    color: var(--text);
  }

  .pagination-controls-wrapper button {
    min-width: 110px;
    padding: 10px 18px;
    font-size: 0.92rem;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--primary);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .pagination-controls-wrapper button:hover:not(:disabled) {
    background: color-mix(in srgb, var(--primary) 8%, white);
    border-color: var(--primary);
  }

  .pagination-controls-wrapper button:disabled {
    color: var(--muted);
    background: #f5f3eb;
    border-color: var(--border);
    cursor: not-allowed;
    opacity: 0.65;
  }

  .page-info-panel {
    font-weight: 500;
    color: var(--muted);
  }
</style>

<!-- GLightbox Plugin Assets (Gives the popup, scaling, and the X close button) -->
<link href="https://jsdelivr.net" rel="stylesheet">
<script src="https://jsdelivr.net"></script>

<!-- Add Pagination UI panel right below All Website Media container -->
<div class="pagination-controls-wrapper" id="pagination-controls-element" style="display:none; justify-content:center; align-items:center; gap:20px; padding:20px 0; font-family:sans-serif;">
  <button id="prevBtn" style="padding:10px 20px; border:1px solid #d2d2d7; border-radius:8px; background:#fff; color:#0071e3; cursor:pointer;">&laquo; Previous</button>
  <span id="pageInfo" style="font-weight:500;"></span>
  <button id="nextBtn" style="padding:10px 20px; border:1px solid #d2d2d7; border-radius:8px; background:#fff; color:#0071e3; cursor:pointer;">Next &raquo;</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // Safe helper to strip url queries without chaining array methods
  function getCleanPath(url) {
    if (!url) return '';
    return url.split('#')[0].split('?')[0];
  }

  // Pure deterministic hashing algorithm to match cross-page targets
  function generateCleanImageHash(rawSrc) {
    let cleanUrl = getCleanPath(rawSrc);
    if (!cleanUrl) return 'img-null';
    let hash = 0;
    for (let i = 0; i < cleanUrl.length; i++) {
      hash = (hash << 5) - hash + cleanUrl.charCodeAt(i);
      hash |= 0;
    }
    return 'img-ref-' + Math.abs(hash);
  }

  const posts = document.querySelectorAll('#jekyll-raw-content-vault .vault-item');
  const gridContainer = document.getElementById('media-grid-target');
  const latestContainer = document.getElementById('latest-image-target');
  const paginationControls = document.getElementById('pagination-controls-element');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageInfo = document.getElementById('pageInfo');
  
  let collectedImages = [];
  const imagesPerPage = 10; // Set strictly to 10 items per page
  let currentPage = 0;

  posts.forEach((postElement) => {
    const postUrl = postElement.getAttribute('data-url');
    const postDate = postElement.getAttribute('data-date');
    const postTitle = postElement.getAttribute('data-title');
    const htmlPayload = postElement.querySelector('.post-html-payload');
    const images = htmlPayload.querySelectorAll('img');
    
    images.forEach((img) => {
      let src = img.getAttribute('src');
      if (!src || src.startsWith('data:')) return;
      src = src.trim();

      const uniqueHashId = generateCleanImageHash(src);
      let postLink = postUrl + "#" + uniqueHashId;
      
      let foundCaption = img.getAttribute('alt') || img.getAttribute('title');
      const nextSibling = img.nextElementSibling;
      if (nextSibling && (nextSibling.tagName === 'P' || nextSibling.tagName === 'FIGCAPTION')) {
        if(nextSibling.textContent.trim().length > 1) {
          foundCaption = nextSibling.textContent.trim();
        }
      }
      
      if (!foundCaption || foundCaption.trim() === "") {
        foundCaption = `Image from post: "${postTitle}"`;
      }

      collectedImages.push({
        src: src,
        caption: foundCaption,
        deepLinkUrl: postLink,
        dateString: postDate
      });
    });
  });

  gridContainer.innerHTML = '';
  latestContainer.innerHTML = '';

  if (collectedImages.length === 0) {
    latestContainer.innerHTML = '<p style="color: #666;">No valid image paths discovered across posts.</p>';
    gridContainer.innerHTML = '<p style="color: #666;">Gallery empty.</p>';
    return;
  }

  // Initialize lightbox script mapping (.g-lightbox-call)
  const lightbox = GLightbox({
    selector: '.g-lightbox-call',
    loop: true
  });

  // A. RENDER LATEST IMAGE
  const latestImg = collectedImages[0];
  latestContainer.innerHTML = `
    <div class="media-card latest-card">
      <div class="latest-img-wrapper">
         <a href="${latestImg.src}" class="g-lightbox-call" data-description="${latestImg.caption}">
           <img src="${latestImg.src}" alt="${latestImg.caption}">
         </a>
      </div>
      <div class="latest-info-wrapper">
         <span class="media-date">Published: ${latestImg.dateString}</span>
         <a href="${latestImg.deepLinkUrl}" class="caption-link" target="_blank">
           ${latestImg.caption} &rarr;
         </a>
         <p style="margin-top: 10px; font-size: 0.9rem; color: #666;">Tapping this caption jumps directly to where this image lives inside the article body.</p>
      </div>
    </div>
  `;

  // B. RENDER PAGINATED ARRAYS SUBSET (10 PER PAGE)
  function displayGalleryPage() {
    gridContainer.innerHTML = '';
    
    const startIndex = currentPage * imagesPerPage;
    const endIndex = startIndex + imagesPerPage;
    const currentImagesSubset = collectedImages.slice(startIndex, endIndex);
    
    currentImagesSubset.forEach(item => {
      const cardElement = document.createElement('div');
      cardElement.className = 'grid-card';
      cardElement.innerHTML = `
        <div class="grid-img-wrapper">
          <a href="${item.src}" class="g-lightbox-call" data-description="${item.caption}">
            <img src="${item.src}" alt="${item.caption}" loading="lazy">
          </a>
        </div>
        <span class="media-date">${item.dateString}</span>
        <a href="${item.deepLinkUrl}" class="caption-link" target="_blank" title="Jump straight to item view location">
          ${item.caption}
        </a>
      `;
      gridContainer.appendChild(cardElement);
    });

    lightbox.reload();

    const totalPagesCount = Math.ceil(collectedImages.length / imagesPerPage);
    pageInfo.textContent = `Page ${currentPage + 1} of ${totalPagesCount} (${collectedImages.length} images total)`;
    
    prevBtn.disabled = (currentPage === 0);
    nextBtn.disabled = (currentPage >= totalPagesCount - 1);
  }

  if (collectedImages.length > 0) {
    paginationControls.style.display = 'flex';
    displayGalleryPage();
  }

  prevBtn.addEventListener('click', function() {
    if (currentPage > 0) {
      currentPage--;
      displayGalleryPage();
      gridContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  nextBtn.addEventListener('click', function() {
    if (currentPage < Math.ceil(collectedImages.length / imagesPerPage) - 1) {
      currentPage++;
      displayGalleryPage();
      gridContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
});
</script>

<!-- Post Target Tracker Script (Ensures the live post page has matching hash IDs to jump directly to) -->
<script type="text/javascript">
  document.addEventListener("DOMContentLoaded", function() {
    if (window.location.pathname.includes('/media/') || window.location.pathname.endsWith('/media.html') || window.location.pathname.endsWith('/media')) return;
    
    function generateCleanImageHash(rawSrc) {
      if (!rawSrc) return 'img-null';
      let cleanUrl = rawSrc.split('#')[0].split('?')[0];
      let hash = 0;
      for (let i = 0; i < cleanUrl.length; i++) {
        hash = (hash << 5) - hash + cleanUrl.charCodeAt(i);
        hash |= 0;
      }
      return 'img-ref-' + Math.abs(hash);
    }

    const articleImages = document.querySelectorAll('img');
    articleImages.forEach(img => {
      let src = img.getAttribute('src') || '';
      if (!src || src.startsWith('data:')) return;
      
      let uniqueHashSignature = img.getAttribute('id') || generateCleanImageHash(src.trim());
      img.setAttribute('id', uniqueHashSignature);
      img.style.scrollMarginTop = '120px'; // Offset ensures sticky headers don't cover the image
    });

    if (window.location.hash) {
      const activeFragmentId = decodeURIComponent(window.location.hash.substring(1));
      setTimeout(() => {
        const targetElement = document.getElementById(activeFragmentId);
        if (targetElement) {
          targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, 550);
    }
  });
</script>
