---
layout: page
title: Media Gallery
permalink: test
---

<style>
  .site-main {
    max-width: 1200px !important;
  }

  .media-gallery-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 4px 20px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  .latest-media-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 36px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .latest-title {
    font-family: 'Amiri', serif;
    font-size: 1.55rem;
    margin: 0 0 16px;
    color: var(--text);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 6px;
    display: inline-block;
  }

  .media-card.latest-card {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  @media (min-width: 768px) {
    .media-card.latest-card {
      flex-direction: row;
      align-items: center;
    }
    .latest-img-wrapper {
      flex: 1;
      max-width: 48%;
    }
    .latest-info-wrapper {
      flex: 1;
    }
  }

  .latest-img-wrapper img {
    width: 100%;
    height: auto;
    max-height: 380px;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    background: #f8f6f0;
    cursor: pointer;
  }

  .media-date {
    font-size: 0.82rem;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }

  .caption-link {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--primary);
    text-decoration: none;
    line-height: 1.4;
    transition: color 0.2s ease;
    word-break: break-word;
  }

  .caption-link:hover {
    color: var(--primary-dark);
    text-decoration: underline;
  }

  .gallery-title {
    font-family: 'Amiri', serif;
    font-size: 1.6rem;
    color: var(--text);
    margin: 0 0 20px;
  }

  .media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
    margin-bottom: 28px;
  }

  @media (max-width: 600px) {
    .media-grid {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
  }

  .grid-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  .grid-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  }

  .grid-img-wrapper {
    height: 190px;
    overflow: hidden;
    background: #f5f3eb;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .grid-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .grid-card .caption-link {
    font-size: 0.92rem;
    color: var(--text);
    font-weight: 500;
  }

  .grid-card .caption-link:hover {
    color: var(--primary);
  }

  .pagination-controls-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 18px 0 10px;
    margin-top: 12px;
    font-size: 0.95rem;
    color: var(--text);
    flex-wrap: wrap;
  }

  .pagination-controls-wrapper button {
    min-width: 110px;
    padding: 10px 18px;
    font-size: 0.92rem;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--primary);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .pagination-controls-wrapper button:hover:not(:disabled) {
    background: color-mix(in srgb, var(--primary) 8%, white);
    border-color: var(--primary);
  }

  .pagination-controls-wrapper button:disabled {
    color: var(--muted);
    background: #f5f3eb;
    border-color: var(--border);
    cursor: not-allowed;
    opacity: 0.65;
  }

  .page-info-panel {
    font-weight: 500;
    color: var(--muted);
  }

  /* GLightbox – fit all devices */
  .glightbox-container .gslide {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  .glightbox-container .gslide-media,
  .glightbox-container .gslide-image {
    max-width: 100vw !important;
    max-height: 100vh !important;
    width: auto !important;
    height: auto !important;
    margin: 0 auto !important;
  }

  .glightbox-container .gslide-image img {
    max-width: 96vw !important;
    max-height: 85vh !important;
    width: auto !important;
    height: auto !important;
    object-fit: contain !important;
    display: block !important;
    margin: 0 auto !important;
  }

  @media (max-width: 768px) {
    .glightbox-container .gslide-image img {
      max-width: 98vw !important;
      max-height: 75vh !important;
    }
  }

  .glightbox-container .gslide-description {
    max-width: 90vw !important;
    margin: 10px auto 0 !important;
    text-align: center !important;
    background: rgba(0,0,0,0.7) !important;
    color: #fff !important;
    padding: 10px 14px !important;
    border-radius: 8px !important;
    font-size: 0.9rem !important;
  }

  .gclose {
    width: 44px !important;
    height: 44px !important;
    background: rgba(0, 0, 0, 0.65) !important;
    border-radius: 50% !important;
    top: 14px !important;
    right: 14px !important;
    opacity: 0.95 !important;
    z-index: 99999 !important;
  }

  .gclose:hover {
    background: rgba(0, 0, 0, 0.9) !important;
    transform: scale(1.08);
  }

  .gclose svg {
    width: 22px !important;
    height: 22px !important;
  }

  .glightbox-download-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 16px;
    background: #145a32;
    color: #fff !important;
    border-radius: 6px;
    text-decoration: none !important;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .glightbox-download-btn:hover {
    background: #0e4a2d;
  }

  /* Keep post images inside the content width on all devices */
.post-full .content img,
.post-full img,
.site-main article img,
.site-main .content img {
  max-width: 100% !important;
  height: auto !important;
  display: block;
  margin: 1.2em auto;
  border-radius: 8px;
}
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<div class="media-gallery-container">
  <div class="latest-media-section">
    <h2 class="latest-title">Latest Upload</h2>
    <div id="latest-image-target">Searching for latest file...</div>
  </div>

  <h2 class="gallery-title">All Website Media</h2>
  <div id="media-grid-target" class="media-grid">
    Generating media library...
  </div>

  <div class="pagination-controls-wrapper" id="pagination-controls-element" style="display: none;">
    <button type="button" id="prevBtn" disabled>&laquo; Previous</button>
    <span class="page-info-panel" id="pageInfo"></span>
    <button type="button" id="nextBtn">Next &raquo;</button>
  </div>
</div>

<div id="jekyll-raw-content-vault" style="display: none;">
  {% for post in site.posts %}
    <div class="vault-item"
         data-url="{{ post.url | relative_url }}"
         data-date="{{ post.date | date: '%B %d, %Y' }}"
         data-title="{{ post.title | escape }}">
      <div class="post-html-payload">
        {{ post.content }}
      </div>
    </div>
  {% endfor %}
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

  function getCleanPathString(url) {
    if (!url) return "";
    return url.split("#")[0].split("?")[0].trim();
  }

  function generateCleanImageHash(rawSrc) {
    // For huge base64 strings, only hash a stable prefix so ID stays short
    var cleanUrl = getCleanPathString(rawSrc);
    if (!cleanUrl) return "img-null";
    if (cleanUrl.indexOf("data:") === 0) {
      cleanUrl = cleanUrl.substring(0, 120);
    }
    var hash = 0;
    for (var i = 0; i < cleanUrl.length; i++) {
      hash = ((hash << 5) - hash) + cleanUrl.charCodeAt(i);
      hash |= 0;
    }
    return "img-ref-" + Math.abs(hash);
  }

  function makeDownloadFilename(caption, src) {
    var name = (caption || "image").trim()
      .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
      .replace(/\s+/g, "_")
      .substring(0, 80) || "image";
    var ext = "jpg";
    if (src && src.indexOf("data:image/") === 0) {
      var m = src.match(/^data:image\/([a-zA-Z0-9+]+);/);
      if (m) {
        ext = m[1].toLowerCase().replace("jpeg", "jpg");
        if (ext === "svg+xml") ext = "svg";
      }
    } else {
      var match = (src || "").match(/\.(jpe?g|png|gif|webp|bmp|svg)(\?|$)/i);
      if (match) ext = match[1].toLowerCase();
    }
    return name + "." + ext;
  }

  function buildDescriptionHtml(caption, src) {
    var filename = makeDownloadFilename(caption, src);
    var wrap = document.createElement("div");
    var text = document.createElement("div");
    text.textContent = caption || "";
    wrap.appendChild(text);
    var link = document.createElement("a");
    link.href = src;
    link.className = "glightbox-download-btn";
    link.setAttribute("download", filename);
    link.textContent = "↓ Download Image";
    link.onclick = function (e) { e.stopPropagation(); };
    wrap.appendChild(document.createElement("br"));
    wrap.appendChild(link);
    return wrap.innerHTML;
  }

  var posts = document.querySelectorAll("#jekyll-raw-content-vault .vault-item");
  var gridContainer = document.getElementById("media-grid-target");
  var latestContainer = document.getElementById("latest-image-target");
  var paginationControls = document.getElementById("pagination-controls-element");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var pageInfo = document.getElementById("pageInfo");

  var collectedImages = [];
  var imagesPerPage = 10;
  var currentPage = 0;

  posts.forEach(function (postElement) {
    var postUrl = postElement.getAttribute("data-url") || "";
    var postDate = postElement.getAttribute("data-date") || "";
    var postTitle = postElement.getAttribute("data-title") || "";
    var htmlPayload = postElement.querySelector(".post-html-payload");
    if (!htmlPayload) return;

    var images = htmlPayload.querySelectorAll("img");

    images.forEach(function (img) {
      var src = img.getAttribute("src");
      if (!src) return;
      src = src.trim();
      // Include both normal URLs and base64 data: images

      var matchingHashId = generateCleanImageHash(src);
      var postLink = postUrl + "#" + matchingHashId;

      var foundCaption = img.getAttribute("alt") || img.getAttribute("title") || "";

      var nextSibling = img.nextElementSibling;
      if (nextSibling && (nextSibling.tagName === "P" || nextSibling.tagName === "FIGCAPTION")) {
        var text = (nextSibling.textContent || "").trim();
        if (text.length > 1) foundCaption = text;
      }

      if (!foundCaption || !String(foundCaption).trim()) {
        foundCaption = 'Image from post: "' + postTitle + '"';
      }

      // Keep captions readable
      foundCaption = String(foundCaption).replace(/\s+/g, " ").trim().substring(0, 300);

      collectedImages.push({
        src: src,
        caption: foundCaption,
        deepLinkUrl: postLink,
        dateString: postDate
      });
    });
  });

  gridContainer.innerHTML = "";
  latestContainer.innerHTML = "";

  if (collectedImages.length === 0) {
    latestContainer.textContent = "No images found in posts.";
    gridContainer.textContent = "Gallery empty.";
    return;
  }

  var lightbox = GLightbox({
    loop: true,
    descPosition: "bottom",
    closeButton: true,
    touchNavigation: true,
    keyboardNavigation: true,
    closeOnOutsideClick: true,
    openEffect: "fade",
    closeEffect: "fade",
    zoomable: true,
    draggable: true,
    moreLength: 0
  });

  function createCard(item, isLatest) {
    var card = document.createElement("div");
    card.className = isLatest ? "media-card latest-card" : "grid-card";

    var imgWrap = document.createElement("div");
    imgWrap.className = isLatest ? "latest-img-wrapper" : "grid-img-wrapper";

    var a = document.createElement("a");
    a.href = item.src;
    a.className = "glightbox";
    a.setAttribute("data-description", buildDescriptionHtml(item.caption, item.src));

    var img = document.createElement("img");
    img.src = item.src;
    img.alt = item.caption;
    img.loading = "lazy";
    a.appendChild(img);
    imgWrap.appendChild(a);

    var dateEl = document.createElement("span");
    dateEl.className = "media-date";
    dateEl.textContent = isLatest ? ("Published: " + item.dateString) : item.dateString;

    var captionA = document.createElement("a");
    captionA.href = item.deepLinkUrl;
    captionA.className = "caption-link";
    captionA.title = "Jump to this image in the post";
    captionA.textContent = item.caption + (isLatest ? " →" : "");

    if (isLatest) {
      var info = document.createElement("div");
      info.className = "latest-info-wrapper";
      info.appendChild(dateEl);
      info.appendChild(captionA);
      var hint = document.createElement("p");
      hint.style.cssText = "margin-top:10px;font-size:0.9rem;color:#666;";
      hint.textContent = "Tapping this caption jumps directly to where this image lives inside the article body.";
      info.appendChild(hint);
      card.appendChild(imgWrap);
      card.appendChild(info);
    } else {
      card.appendChild(imgWrap);
      card.appendChild(dateEl);
      card.appendChild(captionA);
    }

    return card;
  }

  // Latest
  latestContainer.appendChild(createCard(collectedImages[0], true));

  function displayGalleryPage() {
    gridContainer.innerHTML = "";

    var startIndex = currentPage * imagesPerPage;
    var endIndex = startIndex + imagesPerPage;
    var pageItems = collectedImages.slice(startIndex, endIndex);

    pageItems.forEach(function (item) {
      gridContainer.appendChild(createCard(item, false));
    });

    lightbox.reload();

    var totalPages = Math.ceil(collectedImages.length / imagesPerPage);
    pageInfo.textContent =
      "Page " + (currentPage + 1) + " of " + totalPages +
      " (" + collectedImages.length + " images total)";

    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage >= totalPages - 1;
  }

  paginationControls.style.display = "flex";
  displayGalleryPage();

  prevBtn.addEventListener("click", function () {
    if (currentPage > 0) {
      currentPage--;
      displayGalleryPage();
      gridContainer.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });

  nextBtn.addEventListener("click", function () {
    if (currentPage < Math.ceil(collectedImages.length / imagesPerPage) - 1) {
      currentPage++;
      displayGalleryPage();
      gridContainer.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });
});
</script>
