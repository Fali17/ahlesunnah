---
layout: page
title: Media Gallery
permalink: test
---

<style>
  .site-main { max-width: 1200px !important; }

  .media-gallery-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 4px 20px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  .latest-media-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 36px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .latest-title {
    font-family: 'Amiri', serif;
    font-size: 1.55rem;
    margin: 0 0 16px;
    color: var(--text);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 6px;
    display: inline-block;
  }

  .media-card.latest-card {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  @media (min-width: 768px) {
    .media-card.latest-card {
      flex-direction: row;
      align-items: center;
    }
    .latest-img-wrapper { flex: 1; max-width: 48%; }
    .latest-info-wrapper { flex: 1; }
  }

  .latest-img-wrapper img {
    width: 100%;
    height: auto;
    max-height: 380px;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    background: #f8f6f0;
    cursor: pointer;
  }

  .media-date {
    font-size: 0.82rem;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }

  .caption-link {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--primary);
    text-decoration: none;
    line-height: 1.4;
    word-break: break-word;
  }
  .caption-link:hover {
    color: var(--primary-dark);
    text-decoration: underline;
  }

  .gallery-title {
    font-family: 'Amiri', serif;
    font-size: 1.6rem;
    color: var(--text);
    margin: 0 0 20px;
  }

  .media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
    margin-bottom: 28px;
  }

  @media (max-width: 600px) {
    .media-grid {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
  }

  .grid-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .grid-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  }

  .grid-img-wrapper {
    height: 190px;
    overflow: hidden;
    background: #f5f3eb;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .grid-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .grid-card .caption-link {
    font-size: 0.92rem;
    color: var(--text);
    font-weight: 500;
  }
  .grid-card .caption-link:hover { color: var(--primary); }

  .pagination-controls-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 18px 0 10px;
    margin-top: 12px;
    font-size: 0.95rem;
    color: var(--text);
    flex-wrap: wrap;
  }
  .pagination-controls-wrapper button {
    min-width: 110px;
    padding: 10px 18px;
    font-size: 0.92rem;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--primary);
    cursor: pointer;
  }
  .pagination-controls-wrapper button:hover:not(:disabled) {
    background: color-mix(in srgb, var(--primary) 8%, white);
    border-color: var(--primary);
  }
  .pagination-controls-wrapper button:disabled {
    color: var(--muted);
    background: #f5f3eb;
    cursor: not-allowed;
    opacity: 0.65;
  }
  .page-info-panel { font-weight: 500; color: var(--muted); }

  /* ===== Built-in lightbox (no GLightbox) ===== */
  #media-lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(0,0,0,0.92);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 12px;
    box-sizing: border-box;
  }
  #media-lightbox.is-open { display: flex; }

  #media-lightbox-img {
    max-width: 96vw;
    max-height: 78vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 6px;
    background: #111;
  }

  @media (max-width: 768px) {
    #media-lightbox-img {
      max-width: 98vw;
      max-height: 70vh;
    }
  }

  #media-lightbox-caption {
    max-width: 90vw;
    margin-top: 12px;
    color: #fff;
    text-align: center;
    font-size: 0.95rem;
    line-height: 1.4;
    background: rgba(0,0,0,0.55);
    padding: 8px 14px;
    border-radius: 8px;
  }

  #media-lightbox-actions {
    margin-top: 12px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  #media-lightbox-download {
    display: inline-block;
    padding: 10px 18px;
    background: #145a32;
    color: #fff !important;
    border-radius: 6px;
    text-decoration: none !important;
    font-size: 0.9rem;
    font-weight: 600;
  }
  #media-lightbox-download:hover { background: #0e4a2d; }

  #media-lightbox-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    z-index: 100000;
  }
  #media-lightbox-close:hover { background: rgba(0,0,0,0.95); }

  @media (max-width: 768px) {
    #media-lightbox-close {
      top: 10px;
      right: 10px;
      width: 42px;
      height: 42px;
    }
  }
</style>

<div class="media-gallery-container">
  <div class="latest-media-section">
    <h2 class="latest-title">Latest Upload</h2>
    <div id="latest-image-target">Searching for latest file...</div>
  </div>

  <h2 class="gallery-title">All Website Media</h2>
  <div id="media-grid-target" class="media-grid">
    Generating media library...
  </div>

  <div class="pagination-controls-wrapper" id="pagination-controls-element" style="display: none;">
    <button type="button" id="prevBtn" disabled>&laquo; Previous</button>
    <span class="page-info-panel" id="pageInfo"></span>
    <button type="button" id="nextBtn">Next &raquo;</button>
  </div>
</div>

<!-- Lightbox (always in the page) -->
<div id="media-lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button type="button" id="media-lightbox-close" aria-label="Close">&times;</button>
  <img id="media-lightbox-img" alt="">
  <div id="media-lightbox-caption"></div>
  <div id="media-lightbox-actions">
    <a id="media-lightbox-download" href="#" download>↓ Download Image</a>
  </div>
</div>

<div id="jekyll-raw-content-vault" style="display: none;">
  {% for post in site.posts %}
    <div class="vault-item"
         data-url="{{ post.url | relative_url }}"
         data-date="{{ post.date | date: '%B %d, %Y' }}"
         data-title="{{ post.title | escape }}">
      <div class="post-html-payload">
        {{ post.content }}
      </div>
    </div>
  {% endfor %}
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

  function getCleanPathString(url) {
    if (!url) return "";
    return url.split("#")[0].split("?")[0].trim();
  }

  function generateCleanImageHash(rawSrc) {
    var cleanUrl = getCleanPathString(rawSrc);
    if (!cleanUrl) return "img-null";
    if (cleanUrl.indexOf("data:") === 0) {
      cleanUrl = cleanUrl.substring(0, 120);
    }
    var hash = 0;
    for (var i = 0; i < cleanUrl.length; i++) {
      hash = ((hash << 5) - hash) + cleanUrl.charCodeAt(i);
      hash |= 0;
    }
    return "img-ref-" + Math.abs(hash);
  }

  function makeDownloadFilename(caption, src) {
    var name = (caption || "image").trim()
      .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
      .replace(/\s+/g, "_")
      .substring(0, 80) || "image";
    var ext = "jpg";
    if (src && src.indexOf("data:image/") === 0) {
      var m = src.match(/^data:image\/([a-zA-Z0-9+]+);/);
      if (m) {
        ext = m[1].toLowerCase().replace("jpeg", "jpg");
        if (ext === "svg+xml") ext = "svg";
      }
    } else {
      var match = (src || "").match(/\.(jpe?g|png|gif|webp|bmp|svg)(\?|$)/i);
      if (match) ext = match[1].toLowerCase();
    }
    return name + "." + ext;
  }

  /* ---------- Lightbox ---------- */
  var lb = document.getElementById("media-lightbox");
  var lbImg = document.getElementById("media-lightbox-img");
  var lbCaption = document.getElementById("media-lightbox-caption");
  var lbDownload = document.getElementById("media-lightbox-download");
  var lbClose = document.getElementById("media-lightbox-close");

  function openLightbox(src, caption) {
    lbImg.src = src;
    lbImg.alt = caption || "";
    lbCaption.textContent = caption || "";
    lbDownload.href = src;
    lbDownload.setAttribute("download", makeDownloadFilename(caption, src));
    lb.classList.add("is-open");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    lb.classList.remove("is-open");
    lbImg.removeAttribute("src");
    document.body.style.overflow = "";
  }

  lbClose.addEventListener("click", function (e) {
    e.preventDefault();
    e.stopPropagation();
    closeLightbox();
  });

  lb.addEventListener("click", function (e) {
    if (e.target === lb) closeLightbox();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && lb.classList.contains("is-open")) {
      closeLightbox();
    }
  });

  /* ---------- Collect images ---------- */
  var posts = document.querySelectorAll("#jekyll-raw-content-vault .vault-item");
  var gridContainer = document.getElementById("media-grid-target");
  var latestContainer = document.getElementById("latest-image-target");
  var paginationControls = document.getElementById("pagination-controls-element");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var pageInfo = document.getElementById("pageInfo");

  var collectedImages = [];
  var imagesPerPage = 10;
  var currentPage = 0;

  posts.forEach(function (postElement) {
    var postUrl = postElement.getAttribute("data-url") || "";
    var postDate = postElement.getAttribute("data-date") || "";
    var postTitle = postElement.getAttribute("data-title") || "";
    var htmlPayload = postElement.querySelector(".post-html-payload");
    if (!htmlPayload) return;

    var images = htmlPayload.querySelectorAll("img");

    images.forEach(function (img) {
      var src = img.getAttribute("src");
      if (!src) return;
      src = src.trim();

      var matchingHashId = generateCleanImageHash(src);
      var postLink = postUrl + "#" + matchingHashId;

      var foundCaption = img.getAttribute("alt") || img.getAttribute("title") || "";

      var nextSibling = img.nextElementSibling;
      if (nextSibling && (nextSibling.tagName === "P" || nextSibling.tagName === "FIGCAPTION")) {
        var text = (nextSibling.textContent || "").trim();
        if (text.length > 1) foundCaption = text;
      }

      if (!foundCaption || !String(foundCaption).trim()) {
        foundCaption = 'Image from post: "' + postTitle + '"';
      }

      foundCaption = String(foundCaption).replace(/\s+/g, " ").trim().substring(0, 300);

      collectedImages.push({
        src: src,
        caption: foundCaption,
        deepLinkUrl: postLink,
        dateString: postDate
      });
    });
  });

  gridContainer.innerHTML = "";
  latestContainer.innerHTML = "";

  if (collectedImages.length === 0) {
    latestContainer.textContent = "No images found in posts.";
    gridContainer.textContent = "Gallery empty.";
    return;
  }

  function createCard(item, isLatest) {
    var card = document.createElement("div");
    card.className = isLatest ? "media-card latest-card" : "grid-card";

    var imgWrap = document.createElement("div");
    imgWrap.className = isLatest ? "latest-img-wrapper" : "grid-img-wrapper";
    imgWrap.style.cursor = "pointer";
    imgWrap.title = "Click to view full size";

    var img = document.createElement("img");
    img.src = item.src;
    img.alt = item.caption;
    img.loading = "lazy";
    imgWrap.appendChild(img);

    // Click image → open lightbox
    imgWrap.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      openLightbox(item.src, item.caption);
    });

    var dateEl = document.createElement("span");
    dateEl.className = "media-date";
    dateEl.textContent = isLatest ? ("Published: " + item.dateString) : item.dateString;

    var captionA = document.createElement("a");
    captionA.href = item.deepLinkUrl;
    captionA.className = "caption-link";
    captionA.title = "Jump to this image in the post";
    captionA.textContent = item.caption + (isLatest ? " →" : "");

    if (isLatest) {
      var info = document.createElement("div");
      info.className = "latest-info-wrapper";
      info.appendChild(dateEl);
      info.appendChild(captionA);
      var hint = document.createElement("p");
      hint.style.cssText = "margin-top:10px;font-size:0.9rem;color:#666;";
      hint.textContent = "Tapping this caption jumps directly to where this image lives inside the article body.";
      info.appendChild(hint);
      card.appendChild(imgWrap);
      card.appendChild(info);
    } else {
      card.appendChild(imgWrap);
      card.appendChild(dateEl);
      card.appendChild(captionA);
    }

    return card;
  }

  latestContainer.appendChild(createCard(collectedImages[0], true));

  function displayGalleryPage() {
    gridContainer.innerHTML = "";

    var startIndex = currentPage * imagesPerPage;
    var endIndex = startIndex + imagesPerPage;
    var pageItems = collectedImages.slice(startIndex, endIndex);

    pageItems.forEach(function (item) {
      gridContainer.appendChild(createCard(item, false));
    });

    var totalPages = Math.ceil(collectedImages.length / imagesPerPage);
    pageInfo.textContent =
      "Page " + (currentPage + 1) + " of " + totalPages +
      " (" + collectedImages.length + " images total)";

    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage >= totalPages - 1;
  }

  paginationControls.style.display = "flex";
  displayGalleryPage();

  prevBtn.addEventListener("click", function () {
    if (currentPage > 0) {
      currentPage--;
      displayGalleryPage();
      gridContainer.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });

  nextBtn.addEventListener("click", function () {
    if (currentPage < Math.ceil(collectedImages.length / imagesPerPage) - 1) {
      currentPage++;
      displayGalleryPage();
      gridContainer.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });
});
</script>
