---
layout: page
title: Media Gallery
permalink: test
---

<style>
  .site-main { max-width: 1280px !important; padding-top: 12px !important; }

  .mg {
    --p: var(--primary, #0e4a2d);
    --a: var(--accent, #c8a415);
    --c: var(--card, #fff);
    --t: var(--text, #1e293b);
    --m: var(--muted, #64748b);
    --b: var(--border, #e7e5e4);
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 8px 48px;
    font-family: Inter, system-ui, sans-serif;
  }

  .mg-hero {
    background: linear-gradient(135deg, var(--p) 0%, #0a3721 100%);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 28px;
    color: #fff;
    border-bottom: 3px solid var(--a);
  }
  .mg-hero h1 {
    font-family: Amiri, serif;
    font-size: clamp(1.55rem, 4vw, 2rem);
    margin: 0 0 6px;
  }
  .mg-hero p { margin: 0 0 14px; opacity: 0.9; font-size: 0.95rem; }
  .mg-stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .mg-stat {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .mg-featured {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 18px;
    background: var(--c);
    border: 1px solid var(--b);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 28px;
    box-shadow: 0 4px 20px rgba(14,74,45,0.06);
  }
  @media (max-width: 768px) { .mg-featured { grid-template-columns: 1fr; } }

  .mg-featured-img {
    border-radius: 12px;
    overflow: hidden;
    background: #f5f3eb;
    cursor: zoom-in;
    aspect-ratio: 16/10;
    position: relative;
  }
  .mg-featured-img img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.4s ease;
  }
  .mg-featured-img:hover img { transform: scale(1.04); }

  .mg-featured-body { display: flex; flex-direction: column; justify-content: center; padding: 6px; }
  .mg-badge {
    display: inline-block; width: fit-content;
    background: color-mix(in srgb, var(--a) 22%, white);
    color: var(--p); font-size: 0.7rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em;
    padding: 4px 10px; border-radius: 999px; margin-bottom: 8px;
  }
  .mg-date { font-size: 0.8rem; color: var(--m); margin-bottom: 6px; }
  .mg-cap {
    color: var(--p); font-weight: 600; text-decoration: none;
    font-size: 1rem; line-height: 1.45; word-break: break-word;
  }
  .mg-cap:hover { text-decoration: underline; }
  .mg-hint { margin-top: 10px; font-size: 0.85rem; color: var(--m); }

  .mg-section {
    font-family: Amiri, serif; font-size: 1.4rem; margin: 0 0 16px; color: var(--t);
  }

  /* Single column: one box, then the next box below it */
  .mg-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }

  .mg-card {
    background: var(--c);
    border: 1px solid var(--b);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex; flex-direction: column;
  }
  .mg-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(14,74,45,0.1);
  }
  .mg-card-media {
    aspect-ratio: 4/3; background: #f0ede4; cursor: zoom-in; overflow: hidden; position: relative;
  }
  .mg-card-media img {
    width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s;
  }
  .mg-card:hover .mg-card-media img { transform: scale(1.05); }
  .mg-card-body { padding: 10px 12px 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .mg-card-body .mg-date { font-size: 0.7rem; }
  .mg-card-body .mg-cap {
    font-size: 0.85rem; font-weight: 500; color: var(--t);
    /* Full caption — no clamp / no ellipsis */
    white-space: normal;
    overflow: visible;
  }
  .mg-card-body .mg-cap:hover { color: var(--p); }

  /* Pager: Previous | Page number (middle) | Next */
  .mg-pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    max-width: 480px;
    margin: 0 auto;
  }
  .mg-pager button {
    min-width: 100px; padding: 10px 16px; font-size: 0.9rem; font-weight: 600;
    border: 1px solid var(--b); border-radius: 10px; background: var(--c); color: var(--p); cursor: pointer;
  }
  .mg-pager button:hover:not(:disabled) {
    border-color: var(--p); background: color-mix(in srgb, var(--p) 8%, white);
  }
  .mg-pager button:disabled { opacity: 0.4; cursor: not-allowed; }
  .mg-page-info {
    font-size: 0.9rem; color: var(--m); font-weight: 500;
    min-width: 120px; text-align: center; flex: 1;
  }

  .mg-empty {
    text-align: center; padding: 40px 16px; color: var(--m);
    border: 1px dashed var(--b); border-radius: 14px; background: var(--c);
  }

  /* Lightbox */
  #mg-lb {
    display: none; position: fixed; inset: 0; z-index: 99999;
    background: rgba(8,20,14,0.94); align-items: center; justify-content: center;
    flex-direction: column; padding: 14px; box-sizing: border-box;
  }
  #mg-lb.open { display: flex; }
  #mg-lb-img {
    max-width: min(96vw, 1100px); max-height: 78vh;
    width: auto; height: auto; object-fit: contain; border-radius: 8px;
    box-shadow: 0 16px 50px rgba(0,0,0,0.45);
  }
  @media (max-width: 768px) {
    #mg-lb-img { max-width: 98vw; max-height: 68vh; }
  }
  #mg-lb-cap {
    max-width: 90vw; margin-top: 12px; color: #f1f5f9; text-align: center;
    font-size: 0.9rem; background: rgba(255,255,255,0.08); padding: 8px 14px; border-radius: 10px;
    white-space: normal; /* full caption */
  }
  #mg-lb-x {
    position: absolute; top: 14px; right: 14px; width: 44px; height: 44px;
    border: none; border-radius: 50%; background: rgba(255,255,255,0.15);
    color: #fff; font-size: 26px; cursor: pointer; line-height: 1;
  }
  #mg-lb-x:hover { background: rgba(255,255,255,0.28); }
</style>

<div class="mg">
  <header class="mg-hero">
    <h1>Media Gallery</h1>
    <p>All images from the site — open full size or jump to the original post.</p>
    <div class="mg-stats">
      <span class="mg-stat" id="mg-total">…</span>
      <span class="mg-stat" id="mg-pages">…</span>
    </div>
  </header>

  <div id="mg-featured"></div>
  <h2 class="mg-section">All media</h2>
  <div id="mg-grid" class="mg-grid"></div>
  <div class="mg-pager" id="mg-pager" style="display:none;">
    <button type="button" id="mg-prev" disabled>← Previous</button>
    <span class="mg-page-info" id="mg-info"></span>
    <button type="button" id="mg-next">Next →</button>
  </div>
</div>

<div id="mg-lb" role="dialog" aria-modal="true">
  <button type="button" id="mg-lb-x" aria-label="Close">&times;</button>
  <img id="mg-lb-img" alt="">
  <div id="mg-lb-cap"></div>
</div>

<!-- Build-time image list (no full post HTML → page stays fast) -->
<script type="application/json" id="mg-data">
[
{%- assign mg_first = true -%}
{%- for post in site.posts -%}
  {%- assign mg_parts = post.content | split: '<img' -%}
  {%- for mg_part in mg_parts -%}
    {%- unless forloop.first -%}
      {%- assign mg_src = '' -%}
      {%- assign mg_alt = '' -%}
      {%- if mg_part contains 'src="' -%}
        {%- assign mg_src = mg_part | split: 'src="' | slice: 1 | first | split: '"' | first -%}
      {%- elsif mg_part contains "src='" -%}
        {%- assign mg_src = mg_part | split: "src='" | slice: 1 | first | split: "'" | first -%}
      {%- endif -%}
      {%- if mg_part contains 'alt="' -%}
        {%- assign mg_alt = mg_part | split: 'alt="' | slice: 1 | first | split: '"' | first -%}
      {%- elsif mg_part contains "alt='" -%}
        {%- assign mg_alt = mg_part | split: "alt='" | slice: 1 | first | split: "'" | first -%}
      {%- endif -%}
      {%- if mg_src != blank -%}
        {%- unless mg_first -%},{%- endunless -%}
        {%- assign mg_first = false -%}
        {
          "src": {{ mg_src | strip | jsonify }},
          "alt": {{ mg_alt | strip | jsonify }},
          "url": {{ post.url | relative_url | jsonify }},
          "date": {{ post.date | date: "%b %d, %Y" | jsonify }},
          "title": {{ post.title | jsonify }}
        }
      {%- endif -%}
    {%- endunless -%}
  {%- endfor -%}
{%- endfor -%}
]
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var PER = 10;
  var page = 0;
  var items = [];

  try {
    items = JSON.parse(document.getElementById("mg-data").textContent);
  } catch (e) {
    document.getElementById("mg-grid").innerHTML =
      '<div class="mg-empty">Could not load image list.</div>';
    return;
  }

  if (!Array.isArray(items)) items = [];

  function cleanPath(u) {
    if (!u) return "";
    return u.split("#")[0].split("?")[0].trim();
  }

  function hashSrc(raw) {
    var s = cleanPath(raw);
    if (!s) return "img-null";
    if (s.indexOf("data:") === 0) s = s.substring(0, 120);
    var h = 0;
    for (var i = 0; i < s.length; i++) {
      h = ((h << 5) - h) + s.charCodeAt(i);
      h |= 0;
    }
    return "img-ref-" + Math.abs(h);
  }

  // Normalize list — full caption (no truncation)
  items = items.map(function (it) {
    var src = (it.src || "").trim();
    var alt = (it.alt || "").trim();
    if (!alt) alt = 'Image from "' + (it.title || "post") + '"';
    return {
      src: src,
      caption: alt.replace(/\s+/g, " "),
      deep: (it.url || "") + "#" + hashSrc(src),
      date: it.date || ""
    };
  }).filter(function (it) { return !!it.src; });

  var totalEl = document.getElementById("mg-total");
  var pagesEl = document.getElementById("mg-pages");
  var featuredEl = document.getElementById("mg-featured");
  var gridEl = document.getElementById("mg-grid");
  var pager = document.getElementById("mg-pager");
  var prevBtn = document.getElementById("mg-prev");
  var nextBtn = document.getElementById("mg-next");
  var info = document.getElementById("mg-info");

  var totalPages = Math.max(1, Math.ceil(items.length / PER));
  totalEl.textContent = items.length + " images";
  pagesEl.textContent = totalPages + (totalPages === 1 ? " page" : " pages");

  if (items.length === 0) {
    featuredEl.innerHTML = "";
    gridEl.innerHTML = '<div class="mg-empty">No images found in posts.</div>';
    return;
  }

  /* Lightbox */
  var lb = document.getElementById("mg-lb");
  var lbImg = document.getElementById("mg-lb-img");
  var lbCap = document.getElementById("mg-lb-cap");

  function openLb(src, caption) {
    lbImg.src = src;
    lbImg.alt = caption || "";
    lbCap.textContent = caption || "";
    lb.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeLb() {
    lb.classList.remove("open");
    lbImg.removeAttribute("src");
    document.body.style.overflow = "";
  }
  document.getElementById("mg-lb-x").addEventListener("click", function (e) {
    e.preventDefault();
    closeLb();
  });
  lb.addEventListener("click", function (e) {
    if (e.target === lb) closeLb();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && lb.classList.contains("open")) closeLb();
  });

  function makeFeatured(it) {
    var wrap = document.createElement("div");
    wrap.className = "mg-featured";

    var media = document.createElement("div");
    media.className = "mg-featured-img";
    media.title = "Click to enlarge";
    var img = document.createElement("img");
    img.src = it.src;
    img.alt = it.caption;
    media.appendChild(img);
    media.addEventListener("click", function () { openLb(it.src, it.caption); });

    var body = document.createElement("div");
    body.className = "mg-featured-body";
    body.innerHTML =
      '<span class="mg-badge">Latest upload</span>' +
      '<div class="mg-date">' + it.date + "</div>";
    var a = document.createElement("a");
    a.className = "mg-cap";
    a.href = it.deep;
    a.textContent = it.caption + " →";
    var hint = document.createElement("p");
    hint.className = "mg-hint";
    hint.textContent = "Caption jumps to the exact place in the post. Image opens full-screen.";
    body.appendChild(a);
    body.appendChild(hint);

    wrap.appendChild(media);
    wrap.appendChild(body);
    return wrap;
  }

  function makeCard(it) {
    var card = document.createElement("article");
    card.className = "mg-card";

    var media = document.createElement("div");
    media.className = "mg-card-media";
    media.title = "Click to enlarge";
    var img = document.createElement("img");
    img.src = it.src;
    img.alt = it.caption;
    img.loading = "lazy";
    media.appendChild(img);
    media.addEventListener("click", function () { openLb(it.src, it.caption); });

    var body = document.createElement("div");
    body.className = "mg-card-body";
    var d = document.createElement("div");
    d.className = "mg-date";
    d.textContent = it.date;
    var a = document.createElement("a");
    a.className = "mg-cap";
    a.href = it.deep;
    a.title = "Jump to this image in the post";
    a.textContent = it.caption;   // full caption
    body.appendChild(d);
    body.appendChild(a);

    card.appendChild(media);
    card.appendChild(body);
    return card;
  }

  featuredEl.appendChild(makeFeatured(items[0]));

  function render() {
    gridEl.innerHTML = "";
    var start = page * PER;
    items.slice(start, start + PER).forEach(function (it) {
      gridEl.appendChild(makeCard(it));
    });
    info.textContent = "Page " + (page + 1) + " of " + totalPages;
    prevBtn.disabled = page === 0;
    nextBtn.disabled = page >= totalPages - 1;
  }

  pager.style.display = "flex";
  render();

  prevBtn.addEventListener("click", function () {
    if (page > 0) {
      page--;
      render();
      gridEl.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });
  nextBtn.addEventListener("click", function () {
    if (page < totalPages - 1) {
      page++;
      render();
      gridEl.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });
});
</script>
